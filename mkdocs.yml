site_name: Autoflow Documentation
site_description: Plateforme d'automatisation entreprise — AWX, Gitea, monitoring, PKI, DR
site_author: Autoflow Team
site_url: https://teachmemore-ressources.github.io/autoflow/
docs_dir: docs
repo_name: autoflow
repo_url: https://git.teachmemore.lan/admin-gitea/autoflow

theme:
  name: material
  language: fr
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/git-alt
    admonition:
      note: octicons/tag-16
      tip: octicons/squirrel-16
      warning: octicons/alert-16
      danger: octicons/zap-16

plugins:
  - search:
      lang: fr
  - mermaid2
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: Sur cette page

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ansible/awx
      name: AWX sur GitHub
  generator: false

extra_css:
  - assets/extra.css

nav:
  - Accueil: index.md

  - Vue d'ensemble:
    - overview/index.md
    - Qu'est-ce qu'Autoflow ?: overview/what-is-autoflow.md
    - Architecture: overview/architecture.md
    - Composants: overview/components.md
    - Prérequis système: overview/requirements.md

  - Démarrage rapide:
    - getting-started/index.md
    - Prérequis: getting-started/prerequisites.md
    - Quick Start: getting-started/quick-start.md
    - Deploy Wizard: getting-started/deploy-wizard.md
    - Post-installation: getting-started/post-install.md

  - Configuration:
    - configuration/index.md
    - Variables d'environnement: configuration/environment-variables.md
    - Réseau & Traefik: configuration/network-topology.md
    - TLS & PKI: configuration/tls-pki.md
    - AWX: configuration/awx.md
    - Gitea: configuration/gitea.md
    - Execution Environments: configuration/execution-environments.md
    - Event Engine: configuration/event-engine.md
    - Monitoring: configuration/monitoring.md
    - Backup & DR: configuration/backup.md
    - Security Scanner: configuration/security-scanner.md
    - Air-gapped: configuration/air-gapped.md

  - Opérations (Day-2):
    - operations/index.md
    - Vérifications quotidiennes: operations/daily-checks.md
    - Dashboards Grafana: operations/monitoring-dashboards.md
    - Gestion des logs: operations/log-management.md
    - Tracing distribué: operations/distributed-tracing.md
    - Backup & Restore: operations/backup-restore.md
    - Mises à jour: operations/updates.md
    - Tuning & Scaling: operations/scaling.md

  - Sécurité:
