---
# Autoflow EE — Base
# ==================
# Image de base pour tous les playbooks Autoflow.
# Contient : ansible-core + collections communes + utilitaires réseau.
#
# Build : make ee-build EE=base
# Push  : make ee-push EE=base

version: 3

images:
  base_image:
    name: 'quay.io/ansible/awx-ee:latest'

dependencies:
  galaxy:
    collections:
      - name: community.general
        version: ">=9.0.0"
      - name: ansible.posix
        version: ">=1.5.0"
      - name: community.crypto
        version: ">=2.18.0"
      - name: community.proxmox
        version: ">=1.6.0"

  python:
    - requests>=2.31.0
    - jinja2>=3.1.0
    - pyyaml>=6.0

  system: []

options:
  package_manager_path: /usr/bin/dnf
