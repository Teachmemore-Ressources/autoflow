---
# ──────────────────────────────────────────────────────────────────────────────
# Autoflow – Receptor configuration for docker-compose
# Single-node, local-only mode (no mesh peers, no TLS).
# ──────────────────────────────────────────────────────────────────────────────

# Node identity – must match the hostname registered by provision_instance
- node:
    id: awx
    datadir: /var/lib/receptor

# Run in local-only mode (no network backends needed)
- local-only: {}

- log-level:
    level: info

# Control socket – used by AWX task dispatcher via receptorctl
- control-service:
    service: control
    filename: /var/run/receptor/receptor.sock

# Local work execution – runs ansible-runner for AWX jobs
- work-command:
    worktype: local
    command: ansible-runner
    params: worker
    allowruntimeparams: true
