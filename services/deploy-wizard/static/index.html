<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autoflow — Deploy Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0a0f1e;
  --surface:  #111827;
  --surface2: #1a2235;
  --surface3: #1f2d42;
  --border:   #1e2d45;
  --border2:  #263552;
  --text:     #f0f4ff;
  --muted:    #6b7fa3;
  --muted2:   #4a5a7a;
  --accent:   #3b7bff;
  --acc-h:    #2563eb;
  --acc-glow: rgba(59,123,255,.18);
  --success:  #10b981;
  --warning:  #f59e0b;
  --danger:   #ef4444;
  --radius:   10px;
  --radius-sm:6px;
  --sw:       240px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--font);height:100%;overflow:hidden}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:var(--sw) 1fr;height:100vh;overflow:hidden}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;backdrop-filter:blur(2px)}

/* ── Sidebar ── */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s;z-index:60}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3b7bff,#7c3aed);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo svg{width:18px;height:18px;color:#fff}
.sb-brand h1{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.sb-brand p{font-size:11px;color:var(--muted);margin-top:1px}
.sb-close{display:none;margin-left:auto;padding:4px;cursor:pointer;color:var(--muted);border-radius:4px}
.sb-close:hover{color:var(--text)}

.sb-nav{flex:1;overflow-y:auto;padding:8px 8px}
.nav-group-label{font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;padding:10px 8px 4px}
.sb-nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;transition:.12s;border-radius:var(--radius-sm);user-select:none;margin-bottom:1px}
.sb-nav a svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.sb-nav a:hover{background:var(--surface2);color:var(--text)}
.sb-nav a:hover svg{opacity:1}
.sb-nav a.active{background:var(--acc-glow);color:var(--accent);font-weight:600}
.sb-nav a.active svg{opacity:1}
.sb-nav a .badge{margin-left:auto;font-size:10px;background:var(--danger);color:#fff;border-radius:99px;padding:1px 6px;display:none;font-weight:700}
.sb-nav a.has-errors .badge{display:inline}

.sb-foot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}

/* ── Main ── */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{padding:12px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0;gap:12px}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-menu{display:none;padding:5px;cursor:pointer;color:var(--muted);border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;transition:.12s}
.tb-menu:hover{background:var(--surface2);color:var(--text)}
.tb-menu svg{width:16px;height:16px;display:block}
.tb-title{font-weight:600;font-size:14px;color:var(--text)}
.tb-status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);flex-shrink:0}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.sdot.up{background:var(--success);box-shadow:0 0 0 2px rgba(16,185,129,.2)}

.content{flex:1;overflow-y:auto;padding:28px 32px}
.section{display:none}
.section.active{display:block}
.sec-header{margin-bottom:24px}
.sec-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.02em;margin-bottom:4px}
.sec-desc{color:var(--muted);font-size:13px;line-height:1.6}

/* ── Fields grid ── */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.field-wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.field label .req{color:var(--danger);font-size:13px;font-weight:700}
.field label .derived-tag{background:rgba(59,123,255,.15);color:var(--accent);font-size:10px;padding:1px 6px;border-radius:4px;text-transform:none;letter-spacing:0;font-weight:600}
.field-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.iw{display:flex;gap:6px}
.iw input,.iw select,.iw textarea{flex:1;min-width:0}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 11px;color:var(--text);font:inherit;width:100%;transition:border-color .12s,box-shadow .12s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-glow)}
input.error,select.error{border-color:var(--danger)}
input[readonly]{opacity:.5;cursor:not-allowed}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:56px;font-size:13px}
select option{background:var(--surface2)}

/* ── Buttons ── */
.btn{padding:8px 14px;border-radius:var(--radius-sm);border:none;cursor:pointer;font:600 13px/1 var(--font);transition:.12s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--acc-h);box-shadow:0 2px 12px rgba(59,123,255,.3)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-icon{padding:7px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;transition:.12s}
.btn-icon svg{width:14px;height:14px;display:block}
.btn-icon:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-sm svg{width:13px;height:13px}
.btn-block{width:100%;justify-content:center}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#000;font-weight:700}

/* ── Log panel ── */
.log-panel{border-top:1px solid var(--border);background:#05080f;flex-shrink:0;max-height:0;transition:max-height .3s ease;overflow:hidden}
.log-panel.open{max-height:240px}
.log-head{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;border-bottom:1px solid var(--border)}
.log-head span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
#log{padding:10px 16px;height:195px;overflow-y:auto;font:12px/1.7 'Courier New',monospace;color:#7dd3a8}
#log .err{color:#f87171}
#log .ok{color:#4ade80;font-weight:700}
#log .info{color:#60a5fa}

/* ── Toast ── */
#toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 16px;font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:999;display:flex;align-items:center;gap:8px;transform:translateY(80px);transition:transform .25s;pointer-events:none}
#toast.show{transform:translateY(0)}
#toast.ok{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Misc ── */
.divider{height:1px;background:var(--border);margin:24px 0}
.sys-cred-action{margin-top:20px;padding:16px;background:rgba(59,123,255,.06);border:1px solid rgba(59,123,255,.2);border-radius:var(--radius);display:flex;flex-direction:column;gap:10px}
.sys-cred-hint{font-size:11px;color:var(--muted);display:flex;align-items:flex-start;gap:6px;line-height:1.5}
.sys-cred-hint svg{flex-shrink:0;margin-top:1px;opacity:.7}
.field-heading{width:100%;border-top:1px solid var(--border);margin:20px 0 4px;padding-top:16px}
.field-heading-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.field-heading-desc{font-size:11px;color:var(--muted);line-height:1.5}
.hint{font-size:11px;color:var(--warning);display:flex;align-items:center;gap:4px;margin-top:4px}
code{font-family:'Courier New',monospace;font-size:.9em;background:var(--surface3);padding:1px 5px;border-radius:3px;color:var(--accent)}

/* ── Apply banner ── */
#apply-banner{display:none;background:rgba(245,158,11,.07);border-bottom:1px solid rgba(245,158,11,.25);padding:9px 24px;flex-shrink:0;align-items:center;gap:10px;flex-wrap:wrap}
#apply-banner.show{display:flex}
.ab-label{color:var(--warning);font-weight:700;font-size:12px;flex-shrink:0;display:flex;align-items:center;gap:5px}
.ab-label svg{width:13px;height:13px}
.ab-chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1}
.ab-chip{background:rgba(245,158,11,.15);color:var(--warning);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600}
.ab-recreate{font-size:11px;color:var(--danger);font-style:italic}
#apply-warnings{display:none;padding:7px 24px;background:rgba(239,68,68,.06);border-bottom:1px solid rgba(239,68,68,.2);font-size:12px;color:#fca5a5;line-height:1.8}

/* ── Pre-flight cards ── */
.preflight-stack{display:flex;flex-direction:column;gap:8px}
.pf-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:flex-start;gap:16px;transition:.12s}
.pf-item:hover{border-color:var(--border2)}
.pf-icon-wrap{width:36px;height:36px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
.pf-icon-wrap svg{width:18px;height:18px;color:var(--accent)}
.pf-body{flex:1;min-width:0}
.pf-title{font-weight:700;font-size:14px;margin-bottom:3px;color:var(--text)}
.pf-desc{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6}
.pf-status{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:10px}
.pf-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.pf-dot.ok{background:var(--success);box-shadow:0 0 0 2px rgba(16,185,129,.2)}
.pf-dot.err{background:var(--danger);box-shadow:0 0 0 2px rgba(239,68,68,.2)}
.pf-dot.running{background:var(--warning);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pf-actions{display:flex;gap:7px;flex-wrap:wrap}
.pf-log{margin-top:10px;background:#05080f;border-radius:var(--radius-sm);padding:8px 12px;font:11px/1.7 'Courier New',monospace;color:#7dd3a8;max-height:120px;overflow-y:auto;display:none;border:1px solid var(--border)}
.pf-log.open{display:block}
.pf-log .err{color:#f87171}
.pf-log .ok{color:#4ade80;font-weight:700}
.pf-log .warn{color:#fbbf24}

.post-deploy-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:16px 0 8px;display:flex;align-items:center;gap:8px}
.post-deploy-label::before,.post-deploy-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Section: CA import hint ── */
.ca-hint-box{margin-top:10px;padding:9px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:var(--radius-sm);font-size:12px;color:var(--warning);display:flex;align-items:flex-start;gap:7px}
.ca-hint-box svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}

/* ── EE section ── */
.ee-prereq{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.ee-prereq-title{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.ee-prereq-title svg{width:14px;height:14px;color:var(--accent)}
.ee-prereq-items{display:flex;flex-direction:column;gap:10px}

.pi-item{display:flex;align-items:flex-start;gap:14px;padding:14px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.pi-icon-wrap{width:32px;height:32px;border-radius:7px;background:var(--surface3);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
.pi-icon-wrap svg{width:16px;height:16px;color:var(--accent)}
.pi-body{flex:1;min-width:0}
.pi-title{font-weight:700;font-size:13px;margin-bottom:2px}
.pi-desc{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.pi-status{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:8px}

.ee-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-bottom:24px}
.ee-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;transition:.15s}
.ee-card:hover{border-color:var(--border2)}
.ee-card-head{display:flex;align-items:center;gap:12px}
.ee-card-icon{width:38px;height:38px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ee-card-icon svg{width:20px;height:20px}
.ee-name{font-weight:700;font-size:14px}
.ee-desc{font-size:11px;color:var(--muted);line-height:1.5}
.ee-tag{font-size:10px;font-family:'Courier New',monospace;background:var(--surface2);color:var(--muted);border-radius:4px;padding:2px 7px;margin-top:2px;display:inline-block;word-break:break-all}
.ee-status{display:flex;align-items:center;gap:6px;font-size:12px}
.ee-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.ee-dot.ok{background:var(--success);box-shadow:0 0 0 2px rgba(16,185,129,.2)}
.ee-dot.err{background:var(--danger);box-shadow:0 0 0 2px rgba(239,68,68,.15)}
.ee-dot.running{background:var(--warning);animation:pulse 1s infinite}
.ee-actions{display:flex;gap:6px;flex-wrap:wrap}
.ee-log{background:#05080f;border-radius:var(--radius-sm);padding:8px 12px;font:11px/1.7 'Courier New',monospace;color:#7dd3a8;max-height:180px;overflow-y:auto;display:none;border:1px solid var(--border);margin-top:4px}
.ee-log.open{display:block}
.ee-log .err{color:#f87171}
.ee-log .ok{color:#4ade80;font-weight:700}
.ee-log .warn{color:#fbbf24}
.ee-rollback-panel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-top:4px}
.ee-rollback-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.ee-rollback-list{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.ee-version-row{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.ee-version-tag{font-size:12px;color:var(--text);flex:1}
.ee-version-raw{font-size:10px;font-family:'Courier New',monospace;color:var(--muted);flex-shrink:0}
.btn-xs{padding:3px 10px;font-size:11px;border-radius:5px}
.btn-warn{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
.btn-warn:hover{background:rgba(245,158,11,.25)}

/* ── Sub-section header ── */
.sub-section{margin-top:24px}
.sub-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:-.01em}
.sub-desc{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5}

/* ── System preflight checks grid ── */
.sys-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin:8px 0 2px}
.sys-check{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.sys-check-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.sys-check-dot.ok{background:var(--success);box-shadow:0 0 0 2px rgba(16,185,129,.2)}
.sys-check-dot.err{background:var(--danger);box-shadow:0 0 0 2px rgba(239,68,68,.2)}
.sys-check-body{min-width:0}
.sys-check-label{font-size:11px;font-weight:700;color:var(--text);margin-bottom:1px}
.sys-check-detail{font-size:11px;color:var(--muted);line-height:1.4;word-break:break-word}
.sys-check-detail.err{color:#fca5a5}

/* ── DR status row ── */
.dr-status-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.dr-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.dr-stat-label{font-size:10px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.dr-stat-value{font-size:13px;font-weight:600;color:var(--text);word-break:break-all}
.dr-stat-value.ok{color:var(--success)}
.dr-stat-value.warn{color:var(--warning)}
.dr-stat-value.err{color:var(--danger)}

/* ── Responsive ── */
@media (max-width:768px) {
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sw);transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .overlay.open{display:block}
  .tb-menu{display:flex}
  .content{padding:20px 16px}
  .fields{grid-template-columns:1fr}
  .ee-grid{grid-template-columns:1fr}
  .sb-close{display:flex}
}
@media (max-width:520px) {
  .topbar{padding:10px 14px}
  .tb-title{font-size:13px}
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="layout">

<!-- ── Sidebar ─────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <div class="sb-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div class="sb-brand">
      <h1>Autoflow</h1>
      <p>Deploy Wizard</p>
    </div>
    <button class="sb-close" onclick="closeSidebar()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <nav class="sb-nav" id="nav">
    <div class="nav-group-label">Setup</div>
    <a id="nav-preflight" onclick="activateSection('preflight')" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c1.51 0 2.93.37 4.18 1.02"/><path d="M21 3l-9 9"/><path d="M15 3h6v6"/></svg>
      Pre-flight
    </a>
    <a id="nav-ee" onclick="activateSection('ee')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      Exec Environments
    </a>
    <div class="nav-group-label" style="margin-top:4px">Configuration</div>
  </nav>
  <div class="sb-foot">

<script>
// ── State ──────────────────────────────────────────────────────────────────
let SCHEMA = null;
let CONFIG = {};
let currentSection = null;
let pendingServices = [];

// ── Mobile sidebar ─────────────────────────────────────────────────────────
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  const [schema, config] = await Promise.all([
    fetch('/api/schema').then(r => r.json()),
    fetch('/api/config').then(r => r.json()),
  ]);
  SCHEMA = schema;
  CONFIG = config;
  buildNav();
  buildSections();
  activateSection('system');
  pollStatus();
  checkSysPreflight();
  checkPermissionsStatus();
  checkPreflightStatus();
}

// ── System credentials ─────────────────────────────────────────────────────
async function saveSystemCredentials() {
  const user = CONFIG['DEPLOY_USER'] ?? '';
  const pwd  = CONFIG['SUDO_PASSWORD'] ?? '';
  if (!user.trim()) { toast('Utilisateur système requis', 'err'); return; }
  const res = await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ DEPLOY_USER: user, SUDO_PASSWORD: pwd }),
  });
  if (res.ok) {
    toast('Identifiants système enregistrés ✔', 'ok');
    document.querySelector('.sys-cred-action .btn').textContent = '';
    document.querySelector('.sys-cred-action .btn').innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Identifiants enregistrés`;
    document.querySelector('.sys-cred-action .btn').classList.replace('btn-primary','btn-success');
  } else {
    toast('Erreur lors de la sauvegarde', 'err');
  }
}

// ── System preflight ───────────────────────────────────────────────────────
async function checkSysPreflight() {
  let d = {};
  try { d = await fetch('/api/system/preflight').then(r => r.json()); } catch {
    document.getElementById('sys-dot').className = 'pf-dot err';
    document.getElementById('sys-status-text').textContent = 'Unable to check';
    return;
  }
  const checks  = d.checks || [];
  const failing = checks.filter(c => !c.ok);
  const dot = document.getElementById('sys-dot');
  const txt = document.getElementById('sys-status-text');
  const box = document.getElementById('sys-checks');

  dot.className = `pf-dot ${d.all_ok ? 'ok' : 'err'}`;
  txt.textContent = d.all_ok
    ? 'All requirements met'
    : `${failing.length} requirement(s) not met`;

  if (box) {
    box.style.display = 'grid';
    box.innerHTML = checks.map(c => `
      <div class="sys-check">
        <span class="sys-check-dot ${c.ok ? 'ok' : 'err'}"></span>
        <div class="sys-check-body">
          <div class="sys-check-label">${c.label}</div>
          <div class="sys-check-detail ${c.ok ? '' : 'err'}">${c.detail}</div>
        </div>
      </div>`).join('');
  }
}

function runSysPreflight() {
  document.getElementById('sys-dot').className = 'pf-dot running';
  document.getElementById('sys-status-text').textContent = 'Checking…';
  const box = document.getElementById('sys-checks');
  if (box) box.style.display = 'none';
  checkSysPreflight();
}

// ── Permissions ────────────────────────────────────────────────────────────
async function checkPermissionsStatus() {
  try {
    const d = await fetch('/api/permissions/status').then(r => r.json());
    const checks = d.checks || [];
    const failing = checks.filter(c => !c.ok);
    const dot  = document.getElementById('perms-dot');
    const txt  = document.getElementById('perms-status-text');
    const detail = document.getElementById('perms-detail');

    if (d.all_ok) {
      dot.className = 'pf-dot ok';
      txt.textContent = 'All permissions are correct';
    } else {
      dot.className = 'pf-dot err';
      txt.textContent = `${failing.length} issue(s) detected — click "Fix permissions"`;
      detail.style.display = 'block';
      detail.innerHTML = failing.map(c =>
        `<div style="color:var(--warning);margin:2px 0;font-size:12px">${c.detail}</div>`
      ).join('');
    }
  } catch {
    document.getElementById('perms-dot').className = 'pf-dot err';
    document.getElementById('perms-status-text').textContent = 'Unable to verify';
  }
}

function runPermissionsFix() {
  const dot = document.getElementById('perms-dot');
  const txt = document.getElementById('perms-status-text');
  dot.className = 'pf-dot running';
  txt.textContent = 'Fixing…';
  document.getElementById('pf-log-perms').innerHTML = '';
  document.getElementById('perms-detail').style.display = 'none';

  const evts = new EventSource('/api/permissions/fix');
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') {
      evts.close();
      checkPermissionsStatus();
      return;
    }
    const log = document.getElementById('pf-log-perms');
    log.classList.add('open');
    const line = document.createElement('div');
    if (msg.startsWith('[SUCCESS]')) line.className = 'ok';
    else if (msg.startsWith('[ERROR]')) line.className = 'err';
    else if (msg.startsWith('[WARN]') || msg.startsWith('  ⚠')) line.className = 'warn';
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  };
  evts.onerror = () => {
    evts.close();
    checkPermissionsStatus();
  };
}

// ── Pre-flight ──────────────────────────────────────────────────────────────
async function checkPreflightStatus() {
  const domain = CONFIG.DOMAIN || 'localhost';
  document.getElementById('cert-domain').textContent = `*.${domain}`;

  const [cert, awx] = await Promise.all([
    fetch('/api/cert-status').then(r => r.json()),
    fetch('/api/awx-image-status').then(r => r.json()),
  ]);

  const certOk = cert.exists && cert.ca_exists;
  setStatus('cert', certOk,
    certOk
      ? `wildcard.${cert.domain}.crt + Root CA ready`
      : cert.exists
        ? 'Server cert OK but Root CA missing — re-run setup'
        : `Certificate not found — run "Setup PKI & Generate cert"`
  );
  document.getElementById('btn-dl-ca').style.display    = cert.ca_exists ? 'inline-flex' : 'none';
  document.getElementById('ca-import-hint').style.display = cert.ca_exists ? 'flex' : 'none';

  document.getElementById('awx-tag').textContent = awx.tag;
  setStatus('awx', awx.exists,
    awx.exists ? `${awx.tag} found in Docker` : 'Image not found — build required'
  );

  // Post-deploy: Grafana export
  checkGrafanaExportStatus();

  // Post-deploy: Gitea admin
  const gitea = await fetch('/api/init-gitea-status').then(r => r.json()).catch(() => ({}));
  if (!gitea.running) {
    setStatus('gitea', false, 'Stack not running — deploy first');
  } else {
    setStatus('gitea', gitea.exists,
      gitea.exists ? `Admin '${gitea.username}' exists` : `User '${gitea.username}' not found — click "Create Gitea admin"`
    );
  }

  // Post-deploy: AWX token
  const hasToken = !!(CONFIG.AWX_TOKEN || '').trim();
  setStatus('awxtoken', hasToken,
    hasToken ? 'AWX_TOKEN is set in .env' : 'Token not set — click "Generate AWX token" after AWX starts'
  );

  // Warn on deploy buttons if pre-flight incomplete
  const preflightOk = certOk && awx.exists;
  document.getElementById('preflight-warn').style.display = preflightOk ? 'none' : 'flex';
  document.getElementById('btn-deploy').style.opacity     = preflightOk ? '1' : '0.6';
}

function setStatus(id, ok, text) {
  const dot = document.getElementById(`${id}-dot`);
  const txt = document.getElementById(`${id}-status-text`);
  dot.className = `pf-dot ${ok ? 'ok' : 'err'}`;
  txt.textContent = text;
}

function togglePfLog(id) {
  document.getElementById(`pf-log-${id}`).classList.toggle('open');
}

function pfLog(id, msg, cls) {
  const el = document.getElementById(`pf-log-${id}`);
  el.classList.add('open');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function runPreflight(id) {
  const dot = document.getElementById(`${id}-dot`);
  const txt = document.getElementById(`${id}-status-text`);
  dot.className = 'pf-dot running';
  txt.textContent = 'Running…';
  document.getElementById(`pf-log-${id}`).innerHTML = '';

  const url = id === 'cert' ? '/api/generate-cert' : '/api/build-awx';
  const evts = new EventSource(url);
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') { evts.close(); checkPreflightStatus(); return; }
    const cls = msg.startsWith('[ERROR]') ? 'err' : msg.startsWith('[SUCCESS]') ? 'ok' : '';
    pfLog(id, msg, cls);
  };
  evts.onerror = () => {
    pfLog(id, '[ERROR] Stream lost', 'err');
    evts.close();
    checkPreflightStatus();
  };
}

async function checkGrafanaExportStatus() {
  try {
    const d = await fetch('/api/grafana/export-status').then(r => r.json());
    const dot = document.getElementById('grafana-export-dot');
    const txt = document.getElementById('grafana-export-status-text');
    if (!dot) return;
    if (!d.running) {
      dot.className = 'pf-dot err';
      txt.textContent = 'Stack not running — deploy first';
    } else if (d.last_export) {
      dot.className = 'pf-dot ok';
      txt.textContent = `${d.file_count} file(s) — last export ${d.last_export}`;
    } else {
      dot.className = 'pf-dot err';
      txt.textContent = 'No exported files found — click "Export dashboards"';
    }
  } catch {
    const dot = document.getElementById('grafana-export-dot');
    if (dot) dot.className = 'pf-dot err';
  }
}

function runGrafanaExport() {
  const dot = document.getElementById('grafana-export-dot');
  const txt = document.getElementById('grafana-export-status-text');
  dot.className = 'pf-dot running'; txt.textContent = 'Exporting…';
  document.getElementById('pf-log-grafana-export').innerHTML = '';

  const evts = new EventSource('/api/grafana/export');
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') { evts.close(); checkGrafanaExportStatus(); return; }
    const log = document.getElementById('pf-log-grafana-export');
    log.classList.add('open');
    const line = document.createElement('div');
    if (msg.startsWith('[SUCCESS]')) { line.className = 'ok'; dot.className = 'pf-dot ok'; txt.textContent = 'Exported'; }
    else if (msg.startsWith('[ERROR]')) { line.className = 'err'; dot.className = 'pf-dot err'; txt.textContent = 'Failed'; }
    else if (msg.startsWith('[WARN]')) line.className = 'warn';
    line.textContent = msg;
    log.appendChild(line); log.scrollTop = log.scrollHeight;
  };
  evts.onerror = () => {
    evts.close();
    document.getElementById('grafana-export-dot').className = 'pf-dot err';
    document.getElementById('grafana-export-status-text').textContent = 'Connection lost';
  };
}

function runPostDeploy(id) {
  const dot = document.getElementById(`${id}-dot`);
  const txt = document.getElementById(`${id}-status-text`);
  dot.className = 'pf-dot running';
  txt.textContent = 'Running…';
  document.getElementById(`pf-log-${id}`).innerHTML = '';

  const urlMap = { gitea: '/api/init-gitea', awxtoken: '/api/init-awx-token' };
  const evts = new EventSource(urlMap[id]);
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') { evts.close(); checkPreflightStatus(); return; }
    const cls = msg.startsWith('[ERROR]') ? 'err' : msg.startsWith('[SUCCESS]') ? 'ok' : '';
    pfLog(id, msg, cls);
  };
  evts.onerror = () => {
    pfLog(id, '[ERROR] Stream lost', 'err');
    evts.close();
    checkPreflightStatus();
  };
}

// ── Navigation ─────────────────────────────────────────────────────────────
const NAV_ICONS = {

function buildNav() {
  const nav = document.getElementById('nav');
  // Insert "Système" before "Pre-flight" (needed before any privileged operation)
  const sysSec = SCHEMA.sections.find(s => s.id === 'system');
  if (sysSec) {
    document.getElementById('nav-preflight').insertAdjacentHTML('beforebegin', `
      <a id="nav-system" onclick="activateSection('system');closeSidebar()">
        ${NAV_ICONS['system']}
        ${sysSec.label}
        <span class="badge">!</span>
      </a>`);
  }
  // Remaining schema sections (system already inserted above)
  nav.innerHTML += SCHEMA.sections.filter(s => s.id !== 'system').map(s => `
    <a id="nav-${s.id}" onclick="activateSection('${s.id}');closeSidebar()">
      ${NAV_ICONS[s.id] || '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>'}
      ${s.label}
      <span class="badge">!</span>
    </a>`).join('');
}

function activateSection(id) {
  currentSection = id;
  document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.sb-nav a').forEach(el => el.classList.remove('active'));
  const sec = document.getElementById(`sec-${id}`);
  const navLink = document.getElementById(`nav-${id}`);
  if (sec) sec.classList.add('active');
  if (navLink) navLink.classList.add('active');
  const meta = SCHEMA?.sections?.find(s => s.id === id);
  const labels = { preflight: 'Pre-flight checks', ee: 'Execution Environments', backup: 'Disaster Recovery', compliance: 'Compliance & Audit' };
  document.getElementById('section-label').textContent = labels[id] ?? meta?.label ?? id;
  if (id === 'ee') checkEEStatus();
  if (id === 'backup') checkBackupStatus();
  if (id === 'compliance') checkComplianceStatus();
}

// ── Section + Field rendering ──────────────────────────────────────────────
function buildSections() {
  const content = document.getElementById('content');

  // ── Pre-flight section ──
  const preflightHtml = `
    <div class="section" id="sec-preflight">
      <div class="sec-header">
        <div class="sec-title">Pre-flight checks</div>
        <div class="sec-desc">Run these steps before deploying. Each one is required for the stack to start correctly.</div>
      </div>
      <div class="preflight-stack">

        <!-- System Requirements -->

function renderField(f) {
  if (f.type === 'heading') {
    return `<div class="field-heading">
      <div class="field-heading-title">${f.label}</div>
      ${f.description ? `<div class="field-heading-desc">${f.description}</div>` : ''}
    </div>`;
  }
  const val = CONFIG[f.key] ?? f.default ?? '';
  const wide = f.wide ? 'field-wide' : '';
  const derivedTag = f.derived ? '<span class="derived-tag">auto</span>' : '';
  const reqMark = f.required ? '<span class="req">*</span>' : '';

  let input = '';
  if (f.type === 'select') {
    const opts = (f.options || []).map(o =>
      `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`
    ).join('');
    input = `<select id="field-${f.key}" onchange="onFieldChange('${f.key}',this.value)">${opts}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="field-${f.key}" rows="2" oninput="onFieldChange('${f.key}',this.value)">${esc(val)}</textarea>`;
  } else {
    const isPass = f.type === 'password';
    const ro = f.readonly ? 'readonly' : '';
    input = `<input id="field-${f.key}" type="${isPass ? 'password' : f.type || 'text'}"
      value="${esc(val)}" ${ro}
      oninput="onFieldChange('${f.key}',this.value)"
      placeholder="${esc(f.placeholder || '')}">`;
  }

  const eyeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const genIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;

  const eyeBtn = f.type === 'password'
    ? `<button class="btn-icon" title="Show/hide" onclick="togglePass('field-${f.key}')">${eyeIcon}</button>`
    : '';
  const genBtn = f.auto_generate
    ? `<button class="btn-icon" title="Generate" onclick="generateField('${f.key}','${f.generate_type||'hex32'}')">${genIcon}</button>`
    : '';

  return `
    <div class="field ${wide}" id="wrap-${f.key}">
      <label for="field-${f.key}">${f.label} ${reqMark} ${derivedTag}</label>
      <div class="iw">${input}${eyeBtn}${genBtn}</div>
      ${f.description ? `<div class="field-desc">${f.description}</div>` : ''}
    </div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ── Field interaction ──────────────────────────────────────────────────────
function onFieldChange(key, value) {
  CONFIG[key] = value;
  validateField(key, value);
}

function validateField(key, value) {
  const f = SCHEMA.fields.find(x => x.key === key);
  const el = document.getElementById(`field-${key}`);
  if (!f || !el) return true;
  const ok = !f.required || value.trim().length > 0;
  el.classList.toggle('error', !ok);
  updateNavBadges();
  return ok;
}

function updateNavBadges() {
  SCHEMA.sections.forEach(s => {
    const fields = SCHEMA.fields.filter(f => f.section === s.id && f.required);
    const hasError = fields.some(f => {
      const v = CONFIG[f.key] ?? '';
      return !v.trim();
    });
    document.getElementById(`nav-${s.id}`)?.classList.toggle('has-errors', hasError);
  });
}

// ── Derived fields from DOMAIN ─────────────────────────────────────────────
const _timers = {};
function debounce(fn, ms) {
  return function() {
    const k = fn.toString().slice(0,20);
    clearTimeout(_timers[k]);
    _timers[k] = setTimeout(fn, ms);
  };
}

function deriveDomainFields(domain) {
  if (!domain) return;
  const derived = {
    GITEA_DOMAIN:   domain,
    GITEA_ROOT_URL: `https://git.${domain}`,
    PKI_BASE_URL:   `https://pki.${domain}`,
    CORS_ORIGINS:   `https://awx.${domain},https://api.${domain},https://pki.${domain}`,
  };
  for (const [key, val] of Object.entries(derived)) {
    const el = document.getElementById(`field-${key}`);
    if (el) {
      el.value = val;
      CONFIG[key] = val;
    }
  }
}

// ── Secret generation ──────────────────────────────────────────────────────
async function generateField(key, type) {
  const res = await fetch(`/api/generate/${type}`).then(r => r.json());
  const el = document.getElementById(`field-${key}`);
  if (el) {
    el.value = res.value;
    el.type = 'text';
    CONFIG[key] = res.value;
    validateField(key, res.value);
    setTimeout(() => { if (el.type === 'text') el.type = 'password'; }, 2000);
  }
}

async function generateAllSecrets() {
  const toGenerate = SCHEMA.fields.filter(f => f.auto_generate && !CONFIG[f.key]);
  for (const f of toGenerate) {
    await generateField(f.key, f.generate_type || 'hex32');
  }
  toast('All missing secrets generated', 'ok');
}

function togglePass(id) {
  const el = document.getElementById(id);
  if (el) el.type = el.type === 'password' ? 'text' : 'password';
}

// ── Save ───────────────────────────────────────────────────────────────────
async function saveConfig() {
  if (!validateAll()) return;
  const res = await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(CONFIG),
  });
  if (res.ok) {
    const data = await res.json();
    toast('Configuration saved', 'ok');
    showApplyBanner(data);
  } else {
    const err = await res.json().catch(() => ({}));
    toast(err.detail || 'Save failed', 'err');
  }
}

function showApplyBanner(data) {
  const banner   = document.getElementById('apply-banner');
  const warnDiv  = document.getElementById('apply-warnings');
  const chipsDiv = document.getElementById('ab-chips');

  pendingServices = data.affected_services || [];

  if (pendingServices.length > 0) {
    let chips = pendingServices.map(s => `<span class="ab-chip">${s}</span>`).join('');
    if (data.needs_recreate) {
      chips += `<span class="ab-recreate">requires recreate — use "Save &amp; Deploy" instead</span>`;
    }
    chipsDiv.innerHTML = chips;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }

  if (data.warnings && data.warnings.length > 0) {
    warnDiv.innerHTML = data.warnings.map(w => `<div>${w.message}</div>`).join('');
    warnDiv.style.display = 'block';
  } else {
    warnDiv.style.display = 'none';
  }
}

function hideBanner() {
  document.getElementById('apply-banner').classList.remove('show');
  document.getElementById('apply-warnings').style.display = 'none';
  pendingServices = [];
}

function applyChanges() {
  if (!pendingServices.length) return;
  openLog();
  logLine(`Restarting: ${pendingServices.join(', ')}`, 'info');
  const evts = new EventSource(`/api/restart?services=${encodeURIComponent(pendingServices.join(','))}`);
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') {
      evts.close();
      hideBanner();
      pollStatus();
      return;
    }
    const cls = msg.startsWith('[ERROR]') ? 'err' : msg.startsWith('[SUCCESS]') ? 'ok' : '';
    logLine(msg, cls);
  };
  evts.onerror = () => {
    logLine('[ERROR] Connection to restart stream lost', 'err');
    evts.close();
  };
}

function validateAll() {
  let ok = true;
  SCHEMA.fields.filter(f => f.required).forEach(f => {
    if (!validateField(f.key, CONFIG[f.key] ?? '')) ok = false;
  });
  if (!ok) toast('Fill in required fields (marked with *)', 'err');
  return ok;
}

// ── Deploy ─────────────────────────────────────────────────────────────────
async function deploy(withEncrypt) {
  if (!validateAll()) return;

  const [cert, awx] = await Promise.all([
    fetch('/api/cert-status').then(r => r.json()),
    fetch('/api/awx-image-status').then(r => r.json()),
  ]);
  const missing = [];
  if (!cert.exists || !cert.ca_exists) missing.push('TLS certificate (Pre-flight → Setup PKI & Generate cert)');
  if (!awx.exists)                      missing.push('AWX image (Pre-flight → Build AWX image)');
  if (missing.length) {
    toast('Pre-flight incomplete — see Pre-flight section', 'err');
    activateSection('preflight');
    openLog();
    logLine('Deployment blocked — complete pre-flight first:', 'err');
    missing.forEach(m => logLine('   • ' + m, 'err'));
    return;
  }

  await saveConfig();
  openLog();
  logLine('Starting deployment…', 'info');

  const evts = new EventSource(`/api/deploy?encrypt=${withEncrypt}`);
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') {
      evts.close();
      pollStatus();
      return;
    }
    const cls = msg.startsWith('[ERROR]') ? 'err'
              : msg.startsWith('[SUCCESS]') ? 'ok'
              : msg.startsWith('[') ? 'info' : '';
    logLine(msg, cls);
  };
  evts.onerror = () => {
    logLine('[ERROR] Connection to deploy stream lost', 'err');
    evts.close();
  };
}

// ── Log panel ──────────────────────────────────────────────────────────────
function openLog() {
  document.getElementById('log-panel').classList.add('open');
  document.getElementById('log').innerHTML = '';
}

function toggleLog() {
  document.getElementById('log-panel').classList.toggle('open');
}

function logLine(msg, cls) {
  const log = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

// ── Stack status ───────────────────────────────────────────────────────────
async function pollStatus() {
  try {
    const s = await fetch('/api/status').then(r => r.json());
    const dot = document.getElementById('sdot');
    const txt = document.getElementById('stext');
    if (s.running > 0) {
      dot.classList.add('up');
      txt.textContent = `${s.running} container(s) running`;
    } else {
      dot.classList.remove('up');
      txt.textContent = 'Stack not running';
    }
  } catch {
    document.getElementById('stext').textContent = 'Docker unavailable';
  }
}

// ── Toast ──────────────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = (type === 'ok' ? '✓ ' : '✗ ') + msg;
  el.className = `show ${type}`;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

let EE_STATUS = {};

function toggleEELog(id) {
  document.getElementById(`ee-log-${id}`).classList.toggle('open');
}

function eeLog(id, msg, cls) {
  const el = document.getElementById(`ee-log-${id}`);
  el.classList.add('open');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setEEDot(id, state, text) {
  const dot = document.getElementById(`${id}-dot`);
  const txt = document.getElementById(`${id}-status-text`);
  if (dot) dot.className = `ee-dot ${state}`;
  if (txt) txt.textContent = text;
}

function runEEStream(url, logId, onDone) {
  const evts = new EventSource(url);
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') { evts.close(); if (onDone) onDone(); return; }
    const cls = msg.startsWith('[ERROR]') ? 'err'
              : msg.startsWith('[SUCCESS]') ? 'ok'
              : msg.startsWith('[WARN]') ? 'warn' : '';
    eeLog(logId, msg, cls);
  };
  evts.onerror = () => {
    eeLog(logId, '[ERROR] Connection interrupted', 'err');
    evts.close();
    if (onDone) onDone();
  };
}

async function checkEEStatus() {
  try {
    EE_STATUS = await fetch('/api/ee/status').then(r => r.json());
  } catch { return; }

  // ansible-builder
  const ab = EE_STATUS.ansible_builder_version;
  setEEDot('ab', ab ? 'ok' : 'err',
    ab ? `Installed: ${ab}` : 'Not installed — click "Install ansible-builder"');

  // Docker CA
  const caLabel = document.getElementById('ca-registry-label');
  if (caLabel) caLabel.textContent = EE_STATUS.registry || 'git.<domain>';
  setEEDot('ca', EE_STATUS.docker_trusted ? 'ok' : 'err',
    EE_STATUS.docker_trusted
      ? `Docker CA configured for ${EE_STATUS.registry}`
      : `CA not configured for ${EE_STATUS.registry} — click "Configure Docker CA"`);

  // Build EE cards
  buildEECards(EE_STATUS.ees || []);

  // Runner status
  checkRunnerStatus();
}

async function showRollbackPanel(eeId) {
  const panel = document.getElementById(`ee-rb-${eeId}`);
  if (!panel) return;
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const listEl = document.getElementById(`ee-rb-list-${eeId}`);
  listEl.innerHTML = '<span style="opacity:.6;font-size:.82rem">Loading versions…</span>';

  try {
    const d = await fetch(`/api/ee/versions/${encodeURIComponent(eeId)}`).then(r => r.json());
    if (!d.dated_tags || d.dated_tags.length === 0) {
      listEl.innerHTML = '<span style="opacity:.6;font-size:.82rem">No dated tags found — build at least once to enable rollback.</span>';
      return;
    }
    listEl.innerHTML = d.dated_tags.slice(0, 20).map(tag => {
      // Format: YYYYMMDD-HHmmss → YYYY-MM-DD HH:MM:SS
      const dt = tag.length === 15
        ? `${tag.slice(0,4)}-${tag.slice(4,6)}-${tag.slice(6,8)} ${tag.slice(9,11)}:${tag.slice(11,13)}:${tag.slice(13,15)}`
        : tag;
      return `<div class="ee-version-row">
        <span class="ee-version-tag">${dt}</span>
        <span class="ee-version-raw">${tag}</span>
        <button class="btn btn-xs btn-warn" onclick="runRollback('${eeId}','${tag}')">Restore</button>
      </div>`;
    }).join('');
  } catch(e) {
    listEl.innerHTML = `<span style="color:var(--err)">Failed to load versions: ${e.message}</span>`;
  }
}

function runRollback(eeId, version) {
  const log = document.getElementById(`ee-log-rb-${eeId}`);
  if (!log) return;
  log.innerHTML = '';
  log.style.display = 'block';

  const dot = document.getElementById(`ee-dot-${eeId}`);
  const status = document.getElementById(`ee-status-${eeId}`);
  if (dot) dot.className = 'ee-dot running';
  if (status) status.textContent = `Rolling back to ${version}…`;

  const evts = new EventSource(`/api/ee/rollback?ee=${encodeURIComponent(eeId)}&version=${encodeURIComponent(version)}`);
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') {
      evts.close();
      checkEEStatus();
      return;
    }
    const line = document.createElement('div');
    line.className = msg.startsWith('[ERROR]') ? 'log-err'
                   : msg.startsWith('[SUCCESS]') ? 'log-ok'
                   : msg.startsWith('[WARN]') ? 'log-warn' : '';
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  };
  evts.onerror = () => {
    evts.close();
    if (dot) dot.className = 'ee-dot err';
    if (status) status.textContent = 'Rollback connection lost';
    checkEEStatus();
  };
}

async function checkBackupStatus() {
  let d = {};
  try { d = await fetch('/api/backup/status').then(r => r.json()); } catch { return; }

  const snap    = document.getElementById('dr-last-snapshot');
  const repo    = document.getElementById('dr-repo-health');
  const cronSt  = document.getElementById('dr-cron-status');
  const rtoRpo  = document.getElementById('dr-rto-rpo');
  const cronDot = document.getElementById('dr-cron-dot');
  const cronTxt = document.getElementById('dr-cron-dot-text');

  if (!snap) return;  // section not rendered yet

  if (!d.configured) {
    snap.textContent   = 'Not configured';   snap.className   = 'dr-stat-value warn';
    repo.textContent   = 'Set password first'; repo.className = 'dr-stat-value warn';
    cronSt.textContent = '—';
    rtoRpo.textContent = '—';
    if (cronDot) cronDot.className = 'pf-dot';
    if (cronTxt) cronTxt.textContent = 'Set BACKUP_RESTIC_PASSWORD to enable';
    return;
  }

  if (!d.restic_installed) {
    repo.textContent = 'restic not installed'; repo.className = 'dr-stat-value err';
  } else if (d.repo_initialized === false) {
    repo.textContent = 'Repo not initialised — run first backup'; repo.className = 'dr-stat-value warn';
  } else if (d.repo_initialized) {
    repo.textContent = 'Healthy'; repo.className = 'dr-stat-value ok';
  } else {
    repo.textContent = d.backend || '—'; repo.className = 'dr-stat-value';
  }

  if (d.last_snapshot) {
    snap.textContent = `${d.last_snapshot.time}`;
    snap.className   = 'dr-stat-value ok';
  } else {
    snap.textContent = 'No snapshots yet'; snap.className = 'dr-stat-value warn';
  }

  cronSt.textContent = d.cron_installed ? (d.cron_schedule || '—') : 'Not scheduled';
  cronSt.className   = `dr-stat-value ${d.cron_installed ? 'ok' : 'warn'}`;

  rtoRpo.textContent = `RTO ${d.rto}h / RPO ${d.rpo}h`;

  if (cronDot) cronDot.className = `pf-dot ${d.cron_installed ? 'ok' : 'err'}`;
  if (cronTxt) cronTxt.textContent = d.cron_installed
    ? `Cron installed — schedule: ${d.cron_schedule}`
    : 'Cron not installed — click "Install cron"';
}

function runDRBackup() {
  const dot = document.getElementById('dr-backup-dot');
  const txt = document.getElementById('dr-backup-status-text');
  dot.className = 'pf-dot running'; txt.textContent = 'Running…';
  document.getElementById('pf-log-dr-backup').innerHTML = '';

  const evts = new EventSource('/api/backup/run');
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') {
      evts.close();
      checkBackupStatus();
      return;
    }
    const log = document.getElementById('pf-log-dr-backup');
    log.classList.add('open');
    const line = document.createElement('div');
    if (msg.startsWith('[SUCCESS]')) { line.className = 'ok'; dot.className = 'pf-dot ok'; txt.textContent = 'Completed'; }
    else if (msg.startsWith('[ERROR]')) { line.className = 'err'; dot.className = 'pf-dot err'; txt.textContent = 'Failed'; }
    else if (msg.startsWith('[WARN]')) line.className = 'warn';
    line.textContent = msg;
    log.appendChild(line); log.scrollTop = log.scrollHeight;
  };
  evts.onerror = () => {
    evts.close();
    document.getElementById('dr-backup-dot').className = 'pf-dot err';
    document.getElementById('dr-backup-status-text').textContent = 'Connection lost';
  };
}

function runDRSmokeTest() {
  const dot = document.getElementById('dr-test-dot');
  const txt = document.getElementById('dr-test-status-text');
  dot.className = 'pf-dot running'; txt.textContent = 'Running smoke test…';
  document.getElementById('pf-log-dr-test').innerHTML = '';

  const evts = new EventSource('/api/backup/restore-test');
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '[DONE]') { evts.close(); return; }
    const log = document.getElementById('pf-log-dr-test');
    log.classList.add('open');
    const line = document.createElement('div');
    if (msg.startsWith('[SUCCESS]')) {
      line.className = 'ok';
      if (msg.includes('PASSED')) { dot.className = 'pf-dot ok'; txt.textContent = 'PASSED'; }
    } else if (msg.startsWith('[ERROR]')) {
      line.className = 'err'; dot.className = 'pf-dot err'; txt.textContent = 'FAILED';
    } else if (msg.startsWith('[WARN]')) {
      line.className = 'warn';
    }
    line.textContent = msg;
    log.appendChild(line); log.scrollTop = log.scrollHeight;
  };
  evts.onerror = () => {
    evts.close();
    document.getElementById('dr-test-dot').className = 'pf-dot err';
    document.getElementById('dr-test-status-text').textContent = 'Connection lost';
  };
}

async function installBackupCron() {
  const dot = document.getElementById('dr-cron-dot');
  const txt = document.getElementById('dr-cron-dot-text');
  if (dot) dot.className = 'pf-dot running';
  if (txt) txt.textContent = 'Installing…';
  try {
    const r = await fetch('/api/backup/cron/install', { method: 'POST' });
    const d = await r.json();
    if (r.ok) {
      toast(`Cron installed: ${d.schedule}`, 'ok');
      checkBackupStatus();
    } else {
      toast(d.detail || 'Cron install failed', 'err');
      if (dot) dot.className = 'pf-dot err';
      if (txt) txt.textContent = d.detail || 'Install failed';
    }
  } catch (e) {
    toast('Cron install failed', 'err');
    if (dot) dot.className = 'pf-dot err';
  }
}

async function uninstallBackupCron() {
  try {
    const r = await fetch('/api/backup/cron/uninstall', { method: 'DELETE' });
    const d = await r.json();
    if (r.ok) {
      toast('Cron removed', 'ok');
      checkBackupStatus();
    } else {
      toast(d.detail || 'Cron removal failed', 'err');
    }
  } catch (e) {
    toast('Cron removal failed', 'err');
  }
}

async function checkComplianceStatus() {
  let d;
  try { d = await fetch('/api/compliance/status').then(r => r.json()); } catch { return; }

  const lastEl    = document.getElementById('comp-last-report');
  const totalEl   = document.getElementById('comp-total-findings');
  const critEl    = document.getElementById('comp-critical');
  const highEl    = document.getElementById('comp-high');

  if (!lastEl) return;

  if (!d.scanner_running) {
    lastEl.textContent  = 'Scanner not running';
    lastEl.className    = 'dr-stat-value warn';
    totalEl.textContent = '—';
    critEl.textContent  = '—';
    highEl.textContent  = '—';
    return;
  }

  if (d.report_available && d.generated_at) {
    lastEl.textContent = d.generated_at.slice(0, 19).replace('T', ' ');
    lastEl.className   = 'dr-stat-value ok';
  } else {
    lastEl.textContent = 'No report yet';
    lastEl.className   = 'dr-stat-value warn';
  }

  totalEl.textContent = d.total_findings != null ? d.total_findings : '—';
  const sev = d.by_severity || {};
  critEl.textContent  = sev.CRITICAL != null ? sev.CRITICAL : '—';
  highEl.textContent  = sev.HIGH     != null ? sev.HIGH     : '—';
  if (sev.CRITICAL > 0) critEl.className = 'dr-stat-value err';
  if (sev.HIGH > 0)     highEl.className = 'dr-stat-value warn';
}

function runComplianceGenerate() {
  const dot = document.getElementById('comp-gen-dot');
  const txt = document.getElementById('comp-gen-status-text');
  if (dot) dot.className = 'pf-dot running';
  if (txt) txt.textContent = 'Generating…';
  document.getElementById('pf-log-comp-gen').innerHTML = '';

  const evts = new EventSource('/api/compliance/generate');
  evts.onmessage = e => {
    const msg = e.data;
    if (msg === '__done__' || msg === '[DONE]') {
      evts.close();
      checkComplianceStatus();
      if (dot) dot.className = 'pf-dot ok';
      if (txt) txt.textContent = 'Report generated';
      return;
    }
    const log = document.getElementById('pf-log-comp-gen');
    if (log) {
      const line = document.createElement('div');
      line.className = msg.startsWith('[ERROR]') ? 'log-err'
                     : msg.startsWith('[SUCCESS]') ? 'log-ok' : '';
      line.textContent = msg;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }
    if (msg.startsWith('[ERROR]') && dot) dot.className = 'pf-dot err';
  };
  evts.onerror = () => {
    evts.close();
    if (dot) dot.className = 'pf-dot err';
    if (txt) txt.textContent = 'Connection lost';
  };
}
