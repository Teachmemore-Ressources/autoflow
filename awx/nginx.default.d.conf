# ──────────────────────────────────────────────────────────────────────────────
# AWX nginx vhost fragment
# Mounted into /etc/nginx/default.d/awx.conf inside the awx_web container.
# The base nginx.conf includes /etc/nginx/default.d/*.conf inside its server{}
# block, so these location directives are merged into the existing server.
# ──────────────────────────────────────────────────────────────────────────────

# Serve AWX compiled frontend assets directly (no uWSGI round-trip).
location /static {
    alias /var/lib/awx/public/static;
}

# WebSocket connections → Daphne (ASGI) on port 8051
location /websocket {
    proxy_pass         http://127.0.0.1:8051;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

# All other requests → uWSGI (Django) on socket 127.0.0.1:8050
location / {
    uwsgi_pass             127.0.0.1:8050;
    include                /etc/nginx/uwsgi_params;
    uwsgi_read_timeout     120s;
    uwsgi_connect_timeout  10s;
    uwsgi_send_timeout     120s;
    proxy_set_header       Host              $host;
    proxy_set_header       X-Real-IP         $remote_addr;
    proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto $scheme;
}
