# ──────────────────────────────────────────────────────────────────────────────
# AWX nginx vhost fragment
# Mounted into /etc/nginx/default.d/awx.conf inside the awx_web container.
# The base nginx.conf includes /etc/nginx/default.d/*.conf inside its server{}
# block, so these location directives are merged into the existing server.
# ──────────────────────────────────────────────────────────────────────────────

# Serve AWX compiled frontend assets directly (no uWSGI round-trip).
location /static {
    alias /var/lib/awx/public/static;
}


# WebSocket connections → Daphne (ASGI) on port 8051
location /websocket {
    proxy_pass         http://127.0.0.1:8051;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Passe le proto reçu de Traefik (https) et non $scheme (toujours http en interne)
    proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 86400s;
}

# All other requests → uWSGI (Django) on socket 127.0.0.1:8050
location / {
    uwsgi_pass             127.0.0.1:8050;
    include                /etc/nginx/uwsgi_params;
    uwsgi_read_timeout     120s;
    uwsgi_connect_timeout  10s;
    uwsgi_send_timeout     120s;
    # uwsgi_param transmet les variables WSGI — proxy_set_header est ignoré par uwsgi_pass
    uwsgi_param HTTP_HOST              $http_host;
    uwsgi_param HTTP_X_REAL_IP         $remote_addr;
    uwsgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
    # Passe le proto Traefik (https) au lieu de $scheme (http interne) pour Django SECURE_PROXY_SSL_HEADER
    uwsgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
}
