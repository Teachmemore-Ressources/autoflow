# ── Autoflow Redis configuration ────────────────────────────────────────────
# requirepass is injected at startup by entrypoint.sh (never in process args).

# ── Persistence: AOF + RDB hybrid ────────────────────────────────────────────
appendonly yes
appendfilename redis.aof

# appendfsync everysec  → fsync every second (compromise between safety and speed)
# "always" is safest but ~100× slower. "no" relies on OS (risky).
appendfsync everysec

# Don't block main thread with fsync during a background AOF rewrite.
# Slight data-loss window during the rewrite (max ~1s), but prevents
# stalls when the disk is under load.
no-appendfsync-on-rewrite yes

# Hybrid format: base snapshot (RDB) + incremental commands (AOF).
# Reduces replay time at startup vs pure-command AOF.
aof-use-rdb-preamble yes

# ── AOF auto-rewrite ──────────────────────────────────────────────────────────
# Trigger a rewrite when the AOF has grown 100 % since the last rewrite,
# AND is at least 32 MB. Without this, the incremental file grows without
# bound and takes longer to replay (and to corrupt on a hard kill).
#
# IMPORTANT: auto-rewrite requires fork(). If vm.overcommit_memory = 0 on the
# host, fork may be refused and the rewrite silently skipped. The entrypoint
# checks this at startup; see also /etc/sysctl.d/10-redis.conf on the host.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb

# Incremental fsync during RDB/AOF background writes — reduces latency spikes.
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# ── Memory protection ─────────────────────────────────────────────────────────
# Hard cap at 220 MB (container limit is 256 MB in docker-compose.yml).
# When this limit is reached, evict the least-recently-used keys rather than
# crashing or refusing writes. Adjust if you store large persistent datasets.
maxmemory 220mb
maxmemory-policy allkeys-lru

# ── Networking ────────────────────────────────────────────────────────────────
# Limit open connections to avoid runaway client pile-up.
maxclients 200

# ── Logging ──────────────────────────────────────────────────────────────────
loglevel notice

# ── Slow-log ─────────────────────────────────────────────────────────────────
# Log commands slower than 10 ms; keep last 128 entries.
slowlog-log-slower-than 10000
slowlog-max-len 128
