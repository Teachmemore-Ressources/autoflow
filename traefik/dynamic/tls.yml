tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/wildcard.{{ env "DOMAIN" }}.crt
        keyFile:  /etc/traefik/certs/wildcard.{{ env "DOMAIN" }}.key

  certificates:
    - certFile: /etc/traefik/certs/wildcard.{{ env "DOMAIN" }}.crt
      keyFile:  /etc/traefik/certs/wildcard.{{ env "DOMAIN" }}.key
