# ─────────────────────────────────────────────────────────────────────────────
# Traefik dynamic configuration – reusable middlewares
# ─────────────────────────────────────────────────────────────────────────────

http:
  middlewares:

    # Strip /api prefix when routing to the Autoflow API (not needed here since
    # the API is routed by hostname, kept as example)
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - "/api"

    # Common security headers added to every response
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        # browserXssFilter retiré — déprécié depuis 2019, remplacé par CSP
        referrerPolicy: "strict-origin-when-cross-origin"
        # HSTS — force HTTPS pendant 1 an, sous-domaines inclus
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        customResponseHeaders:
          X-Robots-Tag: "noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex"
          Server: ""
          Permissions-Policy: "geolocation=(), camera=(), microphone=(), payment=(), usb=()"

    # BasicAuth pour Prometheus et Alertmanager (accès monitoring)
    # Identifiants : admin / voir MONITORING_ADMIN_PASSWORD dans .env
    monitoring-auth:
      basicAuth:
        usersFile: /etc/traefik/dynamic/monitoring_users

    # Rate-limit by IP: 100 req/s average, burst up to 200
    rate-limit:
      rateLimit:
        average: 100
        burst: 200

    # Gitea reverse-proxy headers — tells Gitea its real public URL.
    # Required so Gitea's container registry builds the correct Bearer realm URL.
    # Without this, the WWW-Authenticate realm points to GITEA_ROOT_URL (internal)
    # instead of the public HTTPS URL, and Docker cannot authenticate for pushes.
    gitea-proxy-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
