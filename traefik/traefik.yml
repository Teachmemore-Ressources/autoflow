# ─────────────────────────────────────────────────────────────────────────────
# Traefik v2.11 – Static configuration
# Autoflow reverse proxy
# ─────────────────────────────────────────────────────────────────────────────

api:
  dashboard: true
  insecure: true          # dashboard exposed on :8080 (no TLS)

ping: {}                  # GET /ping → 200 OK (used by healthcheck)

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  gitea-ssh:
    address: ":2222"

providers:
  docker:
    exposedByDefault: false
    network: autoflow_net
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        X-Forwarded-For: keep
