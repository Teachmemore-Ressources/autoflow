---
# ─────────────────────────────────────────────────────────────
# Autoflow Network — Inventaire d'exemple
#
# Adapter les IPs, credentials et groupes selon votre parc réseau.
# En production, utiliser les credentials AWX (ne jamais stocker
# les mots de passe en clair dans ce fichier).
# ─────────────────────────────────────────────────────────────

all:
  children:

    # ── Cisco IOS / IOS-XE ───────────────────────────────────
    cisco_ios:
      vars:
        ansible_network_os:   cisco.ios.ios
        ansible_connection:   ansible.netcommon.network_cli
        ansible_become:       true
        ansible_become_method: enable
      hosts:
        ios-core-01:
          ansible_host: 192.168.1.1
          site: paris
          role: core
        ios-access-01:
          ansible_host: 192.168.1.2
          site: paris
          role: access

    # ── Cisco NX-OS ──────────────────────────────────────────
    cisco_nxos:
      vars:
        ansible_network_os: cisco.nxos.nxos
        ansible_connection: ansible.netcommon.network_cli
      hosts:
        nxos-dc-01:
          ansible_host: 192.168.2.1
          site: datacenter
          role: spine
        nxos-dc-02:
          ansible_host: 192.168.2.2
          site: datacenter
          role: leaf

    # ── Juniper Junos ────────────────────────────────────────
    juniper:
      vars:
        ansible_network_os: junipernetworks.junos.junos
        ansible_connection: ansible.netcommon.netconf
        ansible_port:       830
      hosts:
        junos-edge-01:
          ansible_host: 192.168.3.1
          site: paris
          role: edge
        junos-qfx-01:
          ansible_host: 192.168.3.2
          site: datacenter
          role: leaf

    # ── Arista EOS ───────────────────────────────────────────
    arista:
      vars:
        ansible_network_os: arista.eos.eos
        ansible_connection: ansible.netcommon.network_cli
        # Pour eAPI REST (alternative) :
        # ansible_connection: ansible.netcommon.httpapi
        # ansible_httpapi_use_ssl: true
      hosts:
        eos-spine-01:
          ansible_host: 192.168.4.1
          site: datacenter
          role: spine

    # ── F5 BIG-IP ────────────────────────────────────────────
    f5:
      vars:
        ansible_connection:     local
        ansible_network_os:     f5networks.f5_modules.bigip
        validate_certs:         false
        server_port:            443
      hosts:
        bigip-prod-01:
          ansible_host: 192.168.5.1
          server:       192.168.5.1
          site:         datacenter

    # ── Groupe global réseau ─────────────────────────────────
    network:
      children:
        cisco_ios:
        cisco_nxos:
        juniper:
        arista:
