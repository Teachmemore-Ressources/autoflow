# ─────────────────────────────────────────────
# Autoflow – AWX-based Automation Platform
# ─────────────────────────────────────────────

networks:
  autoflow:
    driver: bridge
    name: autoflow_net

volumes:
  postgres_data:
  redis_data:
  awx_projects:
  awx_receptor:
  receptor_run:         # shared socket dir between receptor ↔ awx_task
  prometheus_data:
  grafana_data:

# ── Shared environment anchors ───────────────────────────────

# Shared AWX environment – consumed via <<: *awx-env in each AWX service.
x-awx-env: &awx-env
  POSTGRES_DB:        ${POSTGRES_DB:-awx}
  POSTGRES_USER:      ${POSTGRES_USER:-awx}
  POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
  DATABASE_HOST:      postgres
  DATABASE_PORT:      "5432"
  REDIS_HOST:         redis
  REDIS_PORT:         "6379"
  REDIS_PASSWORD:     ${REDIS_PASSWORD}
  AWX_ADMIN_USER:     ${AWX_ADMIN_USER:-admin}
  AWX_ADMIN_PASSWORD: ${AWX_ADMIN_PASSWORD}
  AWX_ADMIN_EMAIL:    ${AWX_ADMIN_EMAIL:-admin@autoflow.local}
  AWX_SECRET_KEY:     ${AWX_SECRET_KEY}

# Log rotation for standard services
x-log-default: &log-default
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Log rotation for heavy AWX services
x-log-heavy: &log-heavy
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:

  # ── PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: autoflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-awx}
      POSTGRES_USER:     ${POSTGRES_USER:-awx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awx} -d ${POSTGRES_DB:-awx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ── Redis ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autoflow_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfilename redis.aof
    volumes:
      - redis_data:/data
    networks:
      - autoflow
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── AWX Migrations (one-shot init container) ─
  # Runs ONCE: migrates DB, creates admin user, loads demo data.
  # awx_web and awx_task will not start until this service exits 0.
  awx_migrate:
    image: ghcr.io/ansible/awx:${AWX_VERSION:-24.6.1}
    container_name: autoflow_awx_migrate
    restart: "no"
    user: root
    entrypoint: ["/bin/bash", "/etc/awx-init/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *awx-env
    volumes:
      - ./awx/settings.py:/etc/tower/settings.py:ro
      - ./awx/init.sh:/etc/awx-init/init.sh:ro
      - awx_projects:/var/lib/awx/projects
      - awx_receptor:/var/lib/awx/receptor
    networks:
      - autoflow
    <<: *log-heavy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  # ── AWX Web (nginx + uWSGI + Daphne) ─────────
  # AWX's internal nginx listens on port 80 inside the container.
  # Exposed directly on AWX_HTTP_PORT (default 80).
  awx_web:
    image: ghcr.io/ansible/awx:${AWX_VERSION:-24.6.1}
    container_name: autoflow_awx_web
    restart: unless-stopped
    hostname: awxweb
    user: root
    command: /usr/bin/launch_awx_web.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      awx_migrate:
        condition: service_completed_successfully
    environment:
      <<: *awx-env
    volumes:
      - ./awx/settings.py:/etc/tower/settings.py:ro
      - ./awx/nginx.default.d.conf:/etc/nginx/default.d/awx.conf:ro
      - awx_projects:/var/lib/awx/projects
      - awx_receptor:/var/lib/awx/receptor
    ports:
      - "${AWX_HTTP_PORT:-80}:80"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/v2/ping/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    <<: *log-heavy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ── Receptor (AWX mesh execution node) ───────
  # Receptor is AWX's job-dispatch transport layer.
  # It must share the receptor_run volume so awx_task can reach the socket.
  receptor:
    image: quay.io/ansible/receptor:latest
    container_name: autoflow_receptor
    restart: unless-stopped
    hostname: awx
    user: root
    command: receptor --config /etc/receptor/receptor.conf
    volumes:
      - ./receptor/receptor.conf:/etc/receptor/receptor.conf:ro
      - receptor_run:/var/run/receptor
      - awx_projects:/var/lib/awx/projects
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "receptorctl --socket /var/run/receptor/receptor.sock status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── AWX Task (Celery dispatcher + workers) ───
  awx_task:
    image: ghcr.io/ansible/awx:${AWX_VERSION:-24.6.1}
    container_name: autoflow_awx_task
    restart: unless-stopped
    hostname: awx
    user: root
    # Custom launcher: provision_instance needs --hostname in non-k8s mode.
    command: /usr/bin/launch_awx_task_autoflow.sh
    depends_on:
      awx_web:
        condition: service_healthy
      receptor:
        condition: service_healthy
    environment:
      <<: *awx-env
      AWX_TASK_HOSTNAME: awx
    volumes:
      - ./awx/settings.py:/etc/tower/settings.py:ro
      - ./awx/launch_awx_task.sh:/usr/bin/launch_awx_task_autoflow.sh:ro
      # AWX reads receptor.conf to locate the control socket path
      - ./receptor/receptor.conf:/etc/receptor/receptor.conf:ro
      - receptor_run:/var/run/receptor
      - awx_projects:/var/lib/awx/projects
      - awx_receptor:/var/lib/awx/receptor
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "awx-manage check || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    <<: *log-heavy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ── Autoflow API (FastAPI) ───────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: autoflow_api
    restart: unless-stopped
    environment:
      # Use the container's hostname (awxweb) — underscored service names
      # fail Django's strict ALLOWED_HOSTS host-header validation.
      AWX_URL:                     http://awxweb
      AWX_ADMIN_USER:              ${AWX_ADMIN_USER:-admin}
      AWX_ADMIN_PASSWORD:          ${AWX_ADMIN_PASSWORD}
      API_SECRET_KEY:              ${API_SECRET_KEY}
      LOG_LEVEL:                   ${LOG_LEVEL:-info}
      CORS_ORIGINS:                ${CORS_ORIGINS:-*}
      RATE_LIMIT:                  ${RATE_LIMIT:-100/minute}
      AWX_METRICS_INTERVAL:        ${AWX_METRICS_INTERVAL:-60}
      # JWT — api_secret_key is used as default if not set
      API_USERNAME:                ${API_USERNAME:-admin}
      API_PASSWORD:                ${API_PASSWORD:-}
      JWT_SECRET_KEY:              ${JWT_SECRET_KEY:-}
      JWT_EXPIRE_MINUTES:          ${JWT_EXPIRE_MINUTES:-60}
      # Notifications
      NOTIFICATION_WEBHOOK_URL:    ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_SLACK_WEBHOOK:  ${NOTIFICATION_SLACK_WEBHOOK:-}
      JOB_WATCHER_INTERVAL:        ${JOB_WATCHER_INTERVAL:-15}
    depends_on:
      awx_web:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── Event Engine v2 (FastAPI) ──────────────────
  # Receives generic events + GitHub/Alertmanager webhooks.
  # Routes to AWX job templates via YAML rule engine with deduplication.
  event_engine:
    build:
      context: ./services/event-engine
      dockerfile: Dockerfile
    container_name: autoflow_event_engine
    restart: unless-stopped
    environment:
      AWX_URL:              http://awxweb
      AWX_TOKEN:            ${AWX_TOKEN}
      AWX_JOB_TEMPLATE_ID:  ${AWX_JOB_TEMPLATE_ID}
      RULES_FILE:           /etc/event-engine/rules.yml
      SCHEDULES_FILE:       /etc/event-engine/schedules.yml
      DEDUP_TTL:            ${DEDUP_TTL:-60}
      LOG_LEVEL:            ${LOG_LEVEL:-info}
      RATE_LIMIT:           ${RATE_LIMIT:-200/minute}
      RATE_LIMIT_WEBHOOKS:  ${RATE_LIMIT_WEBHOOKS:-60/minute}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - ./event-engine/rules.yml:/etc/event-engine/rules.yml:ro
      - ./event-engine/schedules.yml:/etc/event-engine/schedules.yml:ro
    depends_on:
      awx_web:
        condition: service_healthy
    ports:
      - "${EVENT_ENGINE_PORT:-8001}:8001"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── Prometheus ───────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: autoflow_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # ── Grafana ──────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: autoflow_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_LOG_LEVEL:               ${LOG_LEVEL:-info}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── PostgreSQL Exporter ──────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: autoflow_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-awx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-awx}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  # ── Redis Exporter ───────────────────────────
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: autoflow_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR:     "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autoflow
    healthcheck:
      # No shell in this image — use the binary directly
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  # ── Alertmanager ─────────────────────────────
  # Receives firing alerts from Prometheus and routes them to the Autoflow
  # event engine (and optionally Slack/email).
  alertmanager:
    image: prom/alertmanager:latest
    container_name: autoflow_alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --cluster.listen-address=        # single-instance mode, disable mesh
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M
