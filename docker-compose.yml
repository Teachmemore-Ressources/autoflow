# ─────────────────────────────────────────────
# Autoflow – AWX-based Automation Platform
# ─────────────────────────────────────────────

networks:
  autoflow:
    driver: bridge
    name: autoflow_net

volumes:
  # ── Critical volumes — marked external so `docker compose down -v` cannot delete them.
  # Created automatically by the deploy wizard before first `docker compose up`.
  pki_data:
    external: true
    name: autoflow_pki_data
  postgres_data:
    external: true
    name: autoflow_postgres_data
  redis_data:
    external: true
    name: autoflow_redis_data
  gitea_data:
    external: true
    name: autoflow_gitea_data
  gitea_postgres_data:
    external: true
    name: autoflow_gitea_postgres_data

  # ── Non-critical volumes — managed by Compose, recreatable without data loss.
  awx_receptor:
  receptor_run:         # shared socket dir between receptor ↔ awx_task
  prometheus_data:
  grafana_data:
  minio_data:           # MinIO object storage (Loki chunks + index via S3)
  loki_data:            # Loki local working dirs (WAL, TSDB cache, compactor)
  trivy_db:             # Trivy vulnerability DB cache (persisted across restarts)
  act_runner_data:      # Gitea Actions runner state + cache
  tempo_data:           # Tempo trace storage (WAL + blocks)

# ── Shared environment anchors ───────────────────────────────

# Shared AWX environment – consumed via <<: *awx-env in each AWX service.
x-awx-env: &awx-env
  POSTGRES_DB:        ${POSTGRES_DB:-awx}
  POSTGRES_USER:      ${POSTGRES_USER:-awx}
  POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
  DATABASE_HOST:      postgres
  DATABASE_PORT:      "5432"
  REDIS_HOST:         redis
  REDIS_PORT:         "6379"
  REDIS_PASSWORD:     ${REDIS_PASSWORD}
  AWX_ADMIN_USER:     ${AWX_ADMIN_USER:-admin}
  AWX_ADMIN_PASSWORD: ${AWX_ADMIN_PASSWORD}
  AWX_ADMIN_EMAIL:    ${AWX_ADMIN_EMAIL:-admin@autoflow.local}
  AWX_SECRET_KEY:     ${AWX_SECRET_KEY}

# Sécurité Linux — empêche l'escalade de privilèges via SUID/SGID
# NE PAS appliquer sur awx_web, awx_task, awx_migrate, receptor
# (Ansible become:true utilise sudo SUID — no-new-privileges casserait les playbooks)
x-security-default: &security-default
  security_opt:
    - no-new-privileges:true

# Log rotation for standard services
x-log-default: &log-default
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Log rotation for heavy AWX services
x-log-heavy: &log-heavy
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:

  # ── Traefik (Reverse Proxy) ──────────────────
  # Single ingress point for all HTTP services.
  # Dashboard: http://localhost:8080
  # Routes by subdomain: <service>.${DOMAIN:-localhost}
  traefik:
    image: traefik:v2.11
    container_name: autoflow_traefik
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.41"
      DOMAIN: ${DOMAIN:-localhost}
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${GITEA_SSH_PORT:-2222}:2222"
      # Port 8080 retiré — dashboard désactivé (insecure: false dans traefik.yml)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - autoflow
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # ── PostgreSQL ───────────────────────────────
  postgres:
    image: postgres:15.17-alpine  # pinned: was 15-alpine (9 HIGH CVEs fixed)
    container_name: autoflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-awx}
      POSTGRES_USER:     ${POSTGRES_USER:-awx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awx} -d ${POSTGRES_DB:-awx}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ── Redis ────────────────────────────────────
  redis:
    image: redis:7.4.8-alpine     # pinned: was 7-alpine (43 CRITICAL/HIGH CVEs fixed)
    container_name: autoflow_redis
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── AWX Migrations (one-shot init container) ─
  # Runs ONCE: migrates DB, creates admin user, loads demo data.
  # awx_web and awx_task will not start until this service exits 0.
  awx_migrate:
    image: autoflow/awx-patched:${AWX_VERSION:-24.6.1}
    container_name: autoflow_awx_migrate
    restart: "no"
    user: root
    entrypoint: ["/bin/bash", "/etc/awx-init/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *awx-env
      # Needed by init.sh to register EE images and Container Registry credential
      GITEA_ROOT_URL:       ${GITEA_ROOT_URL:-http://localhost:3001}
      GITEA_REGISTRY_TOKEN: ${GITEA_REGISTRY_TOKEN:-}
      EE_DEFAULT_VERSION:   ${EE_DEFAULT_VERSION:-latest}
    volumes:
      - ./awx/settings.py:/etc/tower/settings.py:ro
      - ./awx/init.sh:/etc/awx-init/init.sh:ro
      - /var/lib/awx/projects:/var/lib/awx/projects
      - awx_receptor:/var/lib/awx/receptor
    networks:
      - autoflow
    <<: *log-heavy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  # ── AWX Web (nginx + uWSGI + Daphne) ─────────
  # AWX's internal nginx listens on port 80 inside the container.
  # Exposed directly on AWX_HTTP_PORT (default 80).
  awx_web:
    image: autoflow/awx-patched:${AWX_VERSION:-24.6.1}
    container_name: autoflow_awx_web
    restart: unless-stopped
    hostname: awxweb
    user: root
    command: /usr/bin/launch_awx_web.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      awx_migrate:
        condition: service_completed_successfully
    environment:
      <<: *awx-env
      DOMAIN: ${DOMAIN:-localhost}
      TRAEFIK_CERTS_DIR: ${TRAEFIK_CERTS_DIR:-/home/vagrant/autoflow/traefik/certs}
    volumes:
      - ./awx/settings.py:/etc/tower/settings.py:ro
      - ./awx/nginx.default.d.conf:/etc/nginx/default.d/awx.conf:ro
      - /var/lib/awx/projects:/var/lib/awx/projects
      - awx_receptor:/var/lib/awx/receptor
      - ./awx/custom/index.html:/var/lib/awx/venv/awx/lib/python3.11/site-packages/awx/ui/build/index.html:ro
      - ./awx/custom:/var/lib/awx/public/static/custom:ro
      # SSH keys — mounted so AWX's path validator (runs in awx_web) accepts
      # the entry in AWX_ISOLATION_SHOW_PATHS. Read-only; no private key access needed.
      - ${AWX_SSH_DIR:-./ssh}:/var/lib/awx/.ssh:ro

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.awx.rule=Host(`awx.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.awx.entrypoints=web,websecure"
      - "traefik.http.routers.awx.tls=true"
      - "traefik.http.services.awx.loadbalancer.server.port=80"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/api/v2/ping/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    <<: *log-heavy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ── Receptor (AWX mesh execution node) ───────
  # Receptor is AWX's job-dispatch transport layer.
  # ansible-runner runs HERE (receptor work-command: local) and launches EE
  # containers via Docker (podman → docker symlink in the custom image).
  #
  # DinD path consistency: /tmp is bind-mounted from the host so that paths
  # created inside this container (e.g. /tmp/awx_xxx/) also exist on the host.
  # The host Docker daemon (via socket) can then mount them into EE containers.
  receptor:
    build:
      context: ./receptor
      dockerfile: Dockerfile
    image: autoflow/receptor:local
    container_name: autoflow_receptor
    restart: unless-stopped
    hostname: awx
    user: root
    command: receptor --config /etc/receptor/receptor.conf
    volumes:
      - ./receptor/receptor.conf:/etc/receptor/receptor.conf:ro
      - receptor_run:/var/run/receptor
      - /var/lib/awx/projects:/var/lib/awx/projects
      # Docker socket: ansible-runner calls `podman run` (→ docker) to launch EEs
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mount host /tmp so DinD volume paths are consistent between
      # this container and the host Docker daemon
      - /tmp:/tmp
    group_add:
      - "${DOCKER_GID:-998}"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "receptorctl --socket /var/run/receptor/receptor.sock status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *log-default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── AWX Task (Celery dispatcher + workers) ───
  awx_task:
    image: autoflow/awx-patched:${AWX_VERSION:-24.6.1}
    container_name: autoflow_awx_task
    restart: unless-stopped
    hostname: awx
    user: root
    # Custom launcher: provision_instance needs --hostname in non-k8s mode.
    command: /usr/bin/launch_awx_task_autoflow.sh
    depends_on:
      awx_web:
        condition: service_healthy
      receptor:
        condition: service_healthy
    environment:
      <<: *awx-env
      AWX_TASK_HOSTNAME: awx
      DOMAIN: ${DOMAIN:-localhost}
      TRAEFIK_CERTS_DIR: ${TRAEFIK_CERTS_DIR:-/home/vagrant/autoflow/traefik/certs}
      # SSH keys directory — host absolute path, forwarded to AWX_ISOLATION_SHOW_PATHS
      # so ansible-runner mounts it at /var/lib/awx/.ssh inside every EE container.
      AWX_SSH_DIR: ${AWX_SSH_DIR:-/home/vagrant/autoflow/ssh}
      # Upstream DNS reachable from Docker bridge (not the 127.0.0.53 stub).
      # Set in .env. Leave empty in air-gapped production environments.
      EE_DNS_SERVER: ${EE_DNS_SERVER:-}
    volumes:
      - ./awx/settings.py:/etc/tower/settings.py:ro
      - ./awx/launch_awx_task.sh:/usr/bin/launch_awx_task_autoflow.sh:ro
      # AWX reads receptor.conf to locate the control socket path
      - ./receptor/receptor.conf:/etc/receptor/receptor.conf:ro
      - receptor_run:/var/run/receptor
      - /var/lib/awx/projects:/var/lib/awx/projects
      - awx_receptor:/var/lib/awx/receptor
      # Docker socket: required for ansible-runner to launch EE containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with receptor: private_data_dir paths must be the same on host
      # (only_transmit_kwargs=True passes the path, not the files, to receptor)
      - /tmp:/tmp
      # SSH keys — mounted into awx_task so the awx user has access.
      # EE containers get a separate bind-mount via AWX_ISOLATION_SHOW_PATHS.
      - ${AWX_SSH_DIR:-./ssh}:/var/lib/awx/.ssh:ro
    group_add:
      - "${DOCKER_GID:-998}"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "awx-manage check || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    <<: *log-heavy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ── Autoflow API (FastAPI) ───────────────────
  api:
    build:
      context: ./services
      dockerfile: api/Dockerfile
    container_name: autoflow_api
    restart: unless-stopped
    environment:
      # Use the container's hostname (awxweb) — underscored service names
      # fail Django's strict ALLOWED_HOSTS host-header validation.
      AWX_URL:                     http://awxweb
      AWX_ADMIN_USER:              ${AWX_ADMIN_USER:-admin}
      AWX_ADMIN_PASSWORD:          ${AWX_ADMIN_PASSWORD}
      API_SECRET_KEY:              ${API_SECRET_KEY}
      LOG_LEVEL:                   ${LOG_LEVEL:-info}
      CORS_ORIGINS:                ${CORS_ORIGINS:-*}
      RATE_LIMIT:                  ${RATE_LIMIT:-100/minute}
      AWX_METRICS_INTERVAL:        ${AWX_METRICS_INTERVAL:-60}
      # JWT — api_secret_key is used as default if not set
      API_USERNAME:                ${API_USERNAME:-admin}
      API_PASSWORD:                ${API_PASSWORD:-}
      JWT_SECRET_KEY:              ${JWT_SECRET_KEY:-}
      JWT_EXPIRE_MINUTES:          ${JWT_EXPIRE_MINUTES:-60}
      # Notifications
      NOTIFICATION_WEBHOOK_URL:    ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_SLACK_WEBHOOK:  ${NOTIFICATION_SLACK_WEBHOOK:-}
      JOB_WATCHER_INTERVAL:        ${JOB_WATCHER_INTERVAL:-15}
      # OpenTelemetry distributed tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME:           autoflow-api
    depends_on:
      awx_web:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=3s"
      # Routeur dédié /metrics — monitoring-auth requis, priorité haute (rule plus spécifique)
      - "traefik.http.routers.api-metrics.rule=Host(`api.${DOMAIN:-localhost}`) && Path(`/metrics`)"
      - "traefik.http.routers.api-metrics.entrypoints=websecure"
      - "traefik.http.routers.api-metrics.tls=true"
      - "traefik.http.routers.api-metrics.middlewares=monitoring-auth@file"
      - "traefik.http.routers.api-metrics.service=api"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── Event Engine v2 (FastAPI) ──────────────────
  # Receives generic events + GitHub/Alertmanager webhooks.
  # Routes to AWX job templates via YAML rule engine with deduplication.
  event_engine:
    build:
      context: ./services
      dockerfile: event-engine/Dockerfile
    container_name: autoflow_event_engine
    restart: unless-stopped
    environment:
      AWX_URL:              http://awxweb
      AWX_TOKEN:            ${AWX_TOKEN}
      AWX_JOB_TEMPLATE_ID:  ${AWX_JOB_TEMPLATE_ID}
      RULES_FILE:           /etc/event-engine/rules.yml
      SCHEDULES_FILE:       /etc/event-engine/schedules.yml
      DEDUP_TTL:            ${DEDUP_TTL:-60}
      LOG_LEVEL:            ${LOG_LEVEL:-info}
      RATE_LIMIT:           ${RATE_LIMIT:-200/minute}
      RATE_LIMIT_WEBHOOKS:  ${RATE_LIMIT_WEBHOOKS:-60/minute}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      ADMIN_TOKEN:           ${EVENT_ENGINE_ADMIN_TOKEN:-}
      # Redis — event persistence, retry queue and durable dedup
      # Uses DB 1 to keep event-engine data separate from AWX cache (DB 0)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # OpenTelemetry distributed tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME:           autoflow-event-engine
    volumes:
      - ./event-engine/rules.yml:/etc/event-engine/rules.yml:ro
      - ./event-engine/schedules.yml:/etc/event-engine/schedules.yml:ro
    depends_on:
      awx_web:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.events.rule=Host(`events.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.events.entrypoints=web,websecure"
      - "traefik.http.routers.events.tls=true"
      - "traefik.http.services.events.loadbalancer.server.port=8001"
      - "traefik.http.services.events.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.events.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.events.loadbalancer.healthcheck.timeout=3s"
      - "traefik.http.routers.events-metrics.rule=Host(`events.${DOMAIN:-localhost}`) && Path(`/metrics`)"
      - "traefik.http.routers.events-metrics.entrypoints=websecure"
      - "traefik.http.routers.events-metrics.tls=true"
      - "traefik.http.routers.events-metrics.middlewares=monitoring-auth@file"
      - "traefik.http.routers.events-metrics.service=events"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── Prometheus ───────────────────────────────
  prometheus:
    image: prom/prometheus:v3.11.1
    container_name: autoflow_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.prometheus.entrypoints=web,websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.middlewares=monitoring-auth@file"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # ── Grafana ──────────────────────────────────
  grafana:
    image: grafana/grafana:12.4.2
    container_name: autoflow_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "https://grafana.${DOMAIN:-localhost}/"
      GF_LOG_LEVEL:               ${LOG_LEVEL:-info}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── PostgreSQL Exporter ──────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: autoflow_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-awx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-awx}?sslmode=disable&connect_timeout=10"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  # ── Node Exporter (host system metrics) ─────
  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: autoflow_node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics | head -1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  # ── Redis Exporter ───────────────────────────
  redis_exporter:
    image: oliver006/redis_exporter:v1.82.0
    container_name: autoflow_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR:     "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - autoflow
    healthcheck:
      # No shell in this image — use the binary directly
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  # ── Security Scanner ────────────────────────
  # Runs Trivy CVE scans on all stack images and checks for newer image versions.
  # Exposes results as Prometheus metrics at /metrics (port 8002).
  # Requires the host Docker socket (read-only) to scan local images.
  # IMPORTANT: set DOCKER_GID in .env to the GID of /var/run/docker.sock on the host:
  #   stat -c '%g' /var/run/docker.sock
  security_scanner:
    build:
      context: ./services
      dockerfile: security-scanner/Dockerfile
      args:
        TRIVY_VERSION: "${TRIVY_VERSION:-0.63.0}"
    container_name: autoflow_security_scanner
    restart: unless-stopped
    environment:
      SCAN_INTERVAL:            ${SCAN_INTERVAL:-21600}
      VERSION_CHECK_INTERVAL:   ${VERSION_CHECK_INTERVAL:-3600}
      GITHUB_TOKEN:             ${GITHUB_TOKEN:-}
      DOCKERHUB_USER:           ${DOCKERHUB_USER:-}
      DOCKERHUB_PASSWORD:       ${DOCKERHUB_PASSWORD:-}
      TRIVY_CACHE_DIR:          /home/autoflow/.cache/trivy
      TRIVY_TIMEOUT:            ${TRIVY_TIMEOUT:-300}
      AWX_VERSION:              ${AWX_VERSION:-24.6.1}
      LOG_LEVEL:                ${LOG_LEVEL:-info}
      RATE_LIMIT:               ${RATE_LIMIT:-60/minute}
      # OpenTelemetry distributed tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME:           autoflow-security-scanner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy_db:/home/autoflow/.cache/trivy
    group_add:
      - "${DOCKER_GID:-998}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scanner.rule=Host(`scanner.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.scanner.entrypoints=web,websecure"
      - "traefik.http.routers.scanner.tls=true"
      - "traefik.http.routers.scanner.middlewares=monitoring-auth@file"
      - "traefik.http.services.scanner.loadbalancer.server.port=8002"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # ── Gitea PostgreSQL ─────────────────────────
  # Dedicated PostgreSQL for Gitea — isolated from the AWX database so that
  # a Gitea issue never impacts AWX and vice-versa.
  gitea_postgres:
    image: postgres:15.17-alpine
    container_name: autoflow_gitea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${GITEA_DB_NAME:-gitea}
      POSTGRES_USER:     ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:-change_me_gitea_db}
    volumes:
      - gitea_postgres_data:/var/lib/postgresql/data
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GITEA_DB_USER:-gitea} -d ${GITEA_DB_NAME:-gitea}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── Gitea ─────────────────────────────────────
  # Self-hosted Git service for storing and versioning Ansible playbooks,
  # roles, and EE definitions. AWX can pull directly from Gitea via its
  # "Source Control" credential + project sync feature.
  gitea:
    image: gitea/gitea:1.23-rootless
    container_name: autoflow_gitea
    restart: unless-stopped
    depends_on:
      gitea_postgres:
        condition: service_healthy
    environment:
      # ── Instance ──────────────────────────────
      GITEA__server__DOMAIN:            ${GITEA_DOMAIN:-localhost}
      GITEA__server__HTTP_PORT:         "3001"
      GITEA__server__ROOT_URL:          ${GITEA_ROOT_URL:-http://localhost:3001}
      GITEA__server__SSH_DOMAIN:        ${GITEA_DOMAIN:-localhost}
      GITEA__server__SSH_PORT:          "${GITEA_SSH_PORT:-2222}"
      GITEA__server__START_SSH_SERVER:  "true"
      # ── Database ──────────────────────────────
      GITEA__database__DB_TYPE:    postgres
      GITEA__database__HOST:       gitea_postgres:5432
      GITEA__database__NAME:       ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER:       ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD:     ${GITEA_DB_PASSWORD:-change_me_gitea_db}
      # ── Security ──────────────────────────────
      GITEA__security__SECRET_KEY:          ${GITEA_SECRET_KEY:-change_me_gitea_secret}
      GITEA__security__INTERNAL_TOKEN:      ${GITEA_INTERNAL_TOKEN:-change_me_gitea_internal}
      GITEA__security__INSTALL_LOCK:        "true"   # skip the web installer
      # ── Admin account — created via wizard "Create Gitea admin" (CLI) ──
      # GITEA_ADMIN_* env vars are NOT read by Gitea at runtime; the account
      # must be created with: docker exec autoflow_gitea gitea admin user create
      GITEA__admin__DEFAULT_THEME:          "gitea-dark"
      GITEA__admin__DISABLE_REGISTRATION:   "true"   # only admin can create users
      # ── Metrics (Prometheus) ──────────────────
      GITEA__metrics__ENABLED:       "true"
      GITEA__metrics__TOKEN:         ${GITEA_METRICS_TOKEN:-change_me_metrics_token}
      # ── Container Registry (OCI packages) ─────
      # Gitea serves the container registry on the same HTTP port (3001).
      # Push:  docker push localhost:3001/<user>/<image>:<tag>
      # Pull (intra-stack): docker pull gitea:3001/<user>/<image>:<tag>
      GITEA__packages__ENABLED:                  "true"
      GITEA__packages__CHUNKED_UPLOAD_PATH:      /var/lib/gitea/tmp/packages
      GITEA__packages__LIMIT_TOTAL_OWNER_SIZE:   ${GITEA_REGISTRY_OWNER_LIMIT:--1}  # -1 = unlimited
      GITEA__packages__LIMIT_SIZE_CONTAINER:     ${GITEA_REGISTRY_IMAGE_LIMIT:--1}  # per-image limit
      # ── Mailer (disabled by default) ──────────
      GITEA__mailer__ENABLED:        "false"
      # ── Gitea Actions (CI/CD natif) ────────────────────────────
      GITEA__actions__ENABLED:                "true"
      GITEA__actions__DEFAULT_ACTIONS_URL:    "github"   # fallback vers actions marketplace
      # ── Logging ───────────────────────────────
      GITEA__log__LEVEL:             ${GITEA_LOG_LEVEL:-Warn}
    volumes:
      - gitea_data:/var/lib/gitea
    labels:
      - "traefik.enable=true"
      # HTTP router
      - "traefik.http.routers.gitea.rule=Host(`git.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.gitea.entrypoints=web,websecure"
      - "traefik.http.routers.gitea.tls=true"
      # gitea-proxy-headers injects X-Forwarded-Proto: https so Gitea builds
      # the correct Bearer realm URL for its container registry.
      - "traefik.http.routers.gitea.middlewares=gitea-proxy-headers@file"
      - "traefik.http.services.gitea.loadbalancer.server.port=3001"
      # SSH TCP passthrough (port 2222 → gitea:2222)
      - "traefik.tcp.routers.gitea-ssh.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.gitea-ssh.entrypoints=gitea-ssh"
      - "traefik.tcp.services.gitea-ssh.loadbalancer.server.port=2222"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # ── Gitea Actions Runner ─────────────────────
  # Exécute les jobs CI/CD définis dans .gitea/workflows/*.yml
  # Enregistrement : make gitea-init-runner  (ou via le Deploy Wizard)
  act_runner:
    image: gitea/act_runner:nightly
    container_name: autoflow_act_runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_INSTANCE_URL:    "http://gitea:3001"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${GITEA_RUNNER_TOKEN:-}"
      GITEA_RUNNER_NAME:     "autoflow-runner"
      GITEA_RUNNER_LABELS:   "autoflow,linux,docker,ansible"
      CONFIG_FILE:           /config/act_runner.yml
    volumes:
      - act_runner_data:/data
      - ./act_runner:/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-998}"
    networks:
      - autoflow
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  # ── EE Builder ───────────────────────────────
  # Listens for Gitea push webhooks and rebuilds Execution Environment images
  # when execution-environments/ changes. Needs Docker socket to run
  # ansible-builder and push to the Gitea container registry.
  ee_builder:
    build:
      context: ./services/ee-builder
      dockerfile: Dockerfile
    container_name: autoflow_ee_builder
    restart: unless-stopped
    environment:
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:-}
      GITEA_REGISTRY_TOKEN: ${GITEA_REGISTRY_TOKEN:-}
      GITEA_USER:           ${GITEA_USER:-admin}
      REGISTRY:             gitea:${GITEA_HTTP_PORT:-3001}
      EE_BASE_DIR:          /execution-environments
      BUILD_PYCMD:          /usr/bin/python3.12
      EE_DEFAULT_VERSION:   ${EE_DEFAULT_VERSION:-latest}
      LOG_LEVEL:            ${LOG_LEVEL:-info}
      # OpenTelemetry distributed tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME:           autoflow-ee-builder
    volumes:
      - ./execution-environments:/execution-environments:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-998}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ee-builder.rule=Host(`ee.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.ee-builder.entrypoints=web,websecure"
      - "traefik.http.routers.ee-builder.tls=true"
      - "traefik.http.services.ee-builder.loadbalancer.server.port=8003"
      - "traefik.http.routers.ee-metrics.rule=Host(`ee.${DOMAIN:-localhost}`) && Path(`/metrics`)"
      - "traefik.http.routers.ee-metrics.entrypoints=websecure"
      - "traefik.http.routers.ee-metrics.tls=true"
      - "traefik.http.routers.ee-metrics.middlewares=monitoring-auth@file"
      - "traefik.http.routers.ee-metrics.service=ee-builder"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── MinIO (object storage S3-compatible) ─────────────────────
  # Backend de stockage pour Loki — remplace le filesystem local.
  # Console : https://minio.{DOMAIN}  (protégée par monitoring-auth)
  # API S3  : http://minio:9000       (accès interne uniquement)
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: autoflow_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Désactive la télémétrie MinIO
      MINIO_UPDATE: "off"
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      # Console Web MinIO (port 9001 → minio.{DOMAIN})
      - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.minio.entrypoints=web,websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.middlewares=monitoring-auth@file"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # ── MinIO Init (one-shot) ─────────────────────────────────────
  # Crée le bucket loki-chunks et l'utilisateur Loki dédié (readwrite).
  # S'exécute une seule fois au démarrage, après que MinIO soit healthy.
  minio_init:
    image: minio/mc:latest
    container_name: autoflow_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LOKI_S3_ACCESS_KEY:  ${LOKI_S3_ACCESS_KEY:-loki}
      LOKI_S3_SECRET_KEY:  ${LOKI_S3_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
        mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing minio/loki-chunks &&
        mc admin user info minio $$LOKI_S3_ACCESS_KEY >/dev/null 2>&1 ||
          mc admin user add minio $$LOKI_S3_ACCESS_KEY $$LOKI_S3_SECRET_KEY &&
        mc admin policy attach minio readwrite --user $$LOKI_S3_ACCESS_KEY 2>/dev/null || true &&
        echo 'MinIO: bucket loki-chunks et utilisateur Loki prets.'
      "
    networks:
      - autoflow
    <<: *log-default

  # ── Loki (centralisation des logs) ──────────────────────────
  # Agrège les logs de tous les conteneurs Docker.
  # Interface : grafana.{DOMAIN} → datasource "Loki"
  # Rétention  : LOKI_RETENTION (défaut 720h = 30 jours)
  loki:
    image: grafana/loki:3.4.2
    container_name: autoflow_loki
    restart: unless-stopped
    # -config.expand-env=true : substitue les variables d'env dans loki.yml
    command: -config.file=/etc/loki/loki.yml -config.expand-env=true
    environment:
      # Durée de rétention des logs (ex: 720h = 30j, 2160h = 90j)
      LOKI_RETENTION:      ${LOKI_RETENTION:-720h}
      # Credentials S3 MinIO (utilisateur Loki dédié créé par minio_init)
      LOKI_S3_ACCESS_KEY:  ${LOKI_S3_ACCESS_KEY:-loki}
      LOKI_S3_SECRET_KEY:  ${LOKI_S3_SECRET_KEY}
    depends_on:
      minio_init:
        condition: service_completed_successfully
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./monitoring/loki/rules:/loki/rules:ro
      - loki_data:/loki      # WAL, TSDB cache, compactor workdir, rules-temp
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

  # ── Promtail (agent de collecte de logs) ─────────────────────
  # Découvre tous les conteneurs Docker via le socket et envoie leurs
  # logs vers Loki. Ajoute automatiquement les labels :
  #   container, image, compose_service, stream, level (si JSON)
  promtail:
    image: grafana/promtail:3.4.2
    container_name: autoflow_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # Socket Docker — lecture seule pour la découverte des conteneurs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Logs Docker bruts — lecture seule
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - autoflow
    healthcheck:
      # wget/curl absent from the Promtail image — use bash /dev/tcp instead
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9080 2>/dev/null && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && timeout 2 cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M

  # ── Alertmanager ─────────────────────────────
  # Receives firing alerts from Prometheus and routes them to the Autoflow
  # event engine (and optionally Slack/email).
  alertmanager:
    image: prom/alertmanager:v0.32.0
    container_name: autoflow_alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
      - --cluster.listen-address=        # single-instance mode, disable mesh
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alerts.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.alertmanager.entrypoints=web,websecure"
      - "traefik.http.routers.alertmanager.tls=true"
      - "traefik.http.routers.alertmanager.middlewares=monitoring-auth@file"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M


# ─────────────────────────────────────────────────────────────────────────────
# Autoflow PKI Service — Add to your docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. Copy the `services/pki/` directory alongside your existing services/
# 2. Add the block below to your docker-compose.yml `services:` section
# 3. Add `pki_data:` to your `volumes:` section
# 4. Add the Prometheus scrape job (see prometheus-scrape-job.yml)
# 5. Copy the Grafana dashboard files to your monitoring/ tree
# 6. Add PKI_PORT to your .env (default 8004)
# ─────────────────────────────────────────────────────────────────────────────

  # ── Autoflow PKI (Certificate Authority) ────────────────────────────────
  # Self-hosted PKI with web UI, REST API, wildcard cert support,
  # expiry tracking, revocation, renewal and Prometheus metrics.
  # Web UI:  http://localhost:<PKI_PORT>/ui
  # API:     http://localhost:<PKI_PORT>/api/
  # Metrics: http://localhost:<PKI_PORT>/metrics
  pki:
    build:
      context: ./services/pki
      dockerfile: Dockerfile
    container_name: autoflow_pki
    restart: unless-stopped
    environment:
      PKI_DATA_DIR:        /data/pki
      PKI_JWT_SECRET:      ${PKI_JWT_SECRET}
      PKI_ADMIN_USER:      ${PKI_ADMIN_USER:-admin}
      PKI_ADMIN_PASSWORD:  ${PKI_ADMIN_PASSWORD}
      PKI_KEY_PASSPHRASE:  ${PKI_KEY_PASSPHRASE:-}
      PKI_ALLOWED_ORIGINS: ${PKI_ALLOWED_ORIGINS:-}
      PKI_BASE_URL:        ${PKI_BASE_URL:-http://localhost:8004}
      DOMAIN:              ${DOMAIN:-localhost}
      TRAEFIK_CERTS_DIR:   /traefik/certs
      LOG_LEVEL:           ${LOG_LEVEL:-info}
      # ── LDAP / Active Directory (désactivé par défaut) ──────────────────
      # Mettre LDAP_ENABLED=true et renseigner les paramètres ci-dessous.
      # Les comptes locaux restent actifs en parallèle (LDAP_FALLBACK_LOCAL).
      LDAP_ENABLED:        ${LDAP_ENABLED:-false}
      # Mode : "ldap" pour OpenLDAP/standard, "ad" pour Active Directory
      LDAP_MODE:           ${LDAP_MODE:-ldap}
      # URL du serveur — ldaps:// recommandé en production (chiffrement TLS)
      # Exemples : ldap://ldap.mondomaine.com:389
      #            ldaps://ldap.mondomaine.com:636
      #            ldaps://dc01.mondomaine.com:636  (Active Directory)
      LDAP_URL:            ${LDAP_URL:-}
      # Upgrade STARTTLS sur une connexion ldap:// (alternative à ldaps://)
      LDAP_STARTTLS:       ${LDAP_STARTTLS:-false}
      # Compte de service pour la recherche des utilisateurs dans l'annuaire
      # OpenLDAP  : cn=svc-pki,ou=services,dc=mondomaine,dc=com
      # Active Directory : svc-pki@mondomaine.com  ou  DOMAINE\svc-pki
      LDAP_BIND_DN:        ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD:  ${LDAP_BIND_PASSWORD:-}
      # Base de recherche des utilisateurs
      # OpenLDAP  : ou=users,dc=mondomaine,dc=com
      # Active Directory : CN=Users,DC=mondomaine,DC=com
      LDAP_BASE_DN:        ${LDAP_BASE_DN:-}
      # Filtre de recherche — {username} est remplacé par le login saisi
      # OpenLDAP  : (uid={username})
      # Active Directory : (sAMAccountName={username})
      # AD avec email : (|(sAMAccountName={username})(userPrincipalName={username}@mondomaine.com))
      LDAP_USER_FILTER:    ${LDAP_USER_FILTER:-}
      # Base de recherche des groupes (laisser vide = même que LDAP_BASE_DN)
      # Active Directory : OU=Groups,DC=mondomaine,DC=com
      LDAP_GROUP_BASE_DN:  ${LDAP_GROUP_BASE_DN:-}
      # DN complet du groupe mappé au rôle admin PKI (accès total)
      # Exemple AD : CN=PKI-Admins,OU=Groups,DC=mondomaine,DC=com
      LDAP_GROUP_ADMIN:    ${LDAP_GROUP_ADMIN:-}
      # DN complet du groupe mappé au rôle operator (émettre, révoquer, renouveler)
      # Exemple AD : CN=PKI-Operators,OU=Groups,DC=mondomaine,DC=com
      LDAP_GROUP_OPERATOR: ${LDAP_GROUP_OPERATOR:-}
      # DN complet du groupe mappé au rôle viewer (lecture seule)
      # Exemple AD : CN=PKI-Viewers,OU=Groups,DC=mondomaine,DC=com
      LDAP_GROUP_VIEWER:   ${LDAP_GROUP_VIEWER:-}
      # Certificat CA pour valider le serveur LDAPs (si CA interne/auto-signé)
      # Si le serveur LDAP utilise un cert signé par notre PKI :
      #   /data/pki/ca/<nom_ca>_cert.pem
      # Laisser vide si le cert est signé par une CA publique reconnue.
      LDAP_TLS_CA_CERT:    ${LDAP_TLS_CA_CERT:-}
      # Vérification du certificat serveur LDAPs : true (recommandé) / false
      LDAP_TLS_VERIFY:     ${LDAP_TLS_VERIFY:-true}
      # Délai de connexion LDAP en secondes
      LDAP_TIMEOUT:        ${LDAP_TIMEOUT:-5}
      # Si LDAP injoignable, autoriser les comptes locaux en fallback
      # true = haute disponibilité / false = authentification LDAP obligatoire
      LDAP_FALLBACK_LOCAL: ${LDAP_FALLBACK_LOCAL:-true}
      # OpenTelemetry distributed tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME:           autoflow-pki
    volumes:
      - pki_data:/data/pki
      - ./traefik/certs:/traefik/certs:rw
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pki.rule=Host(`pki.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.pki.entrypoints=web,websecure"
      - "traefik.http.routers.pki.tls=true"
      - "traefik.http.services.pki.loadbalancer.server.port=8004"
      - "traefik.http.routers.pki-metrics.rule=Host(`pki.${DOMAIN:-localhost}`) && Path(`/metrics`)"
      - "traefik.http.routers.pki-metrics.entrypoints=websecure"
      - "traefik.http.routers.pki-metrics.tls=true"
      - "traefik.http.routers.pki-metrics.middlewares=monitoring-auth@file"
      - "traefik.http.routers.pki-metrics.service=pki"
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── OpenTelemetry Collector ──────────────────────────────────────────────
  # Central telemetry gateway: receives OTLP traces from all FastAPI services,
  # filters noise (health/metrics spans), forwards to Tempo.
  # Also exposes span-derived Prometheus metrics on :8889.
  #
  # Endpoints (internal):
  #   gRPC OTLP : otel-collector:4317
  #   HTTP OTLP : otel-collector:4318
  #   Prometheus : otel-collector:8889
  #   Health     : otel-collector:13133
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: autoflow_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./monitoring/otel-collector/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    depends_on:
      - tempo
    networks:
      - autoflow
    healthcheck:
      # Distroless image — no shell, no wget, no curl available inside the container.
      # The /health endpoint is verified externally; disable Docker's built-in check.
      disable: true
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── Tempo (distributed tracing backend) ─────────────────────────────────
  # Grafana Tempo stores and queries traces received from the OTEL Collector.
  # Grafana queries it via the Tempo datasource (HTTP API on port 3200).
  # Metrics generator produces RED metrics written back to Prometheus.
  #
  # Port 4317 : OTLP gRPC  (collector → Tempo)
  # Port 3200 : HTTP API   (Grafana → Tempo)
  tempo:
    image: grafana/tempo:2.6.1
    container_name: autoflow_tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - autoflow
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *log-default
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M

# ─────────────────────────────────────────────────────────────────────────────
