worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 128m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Upstreams ──────────────────────────────────────────
    upstream awx_web {
        # Use hostname (awxweb), not service name (awx_web).
        # Underscores in the Host header fail Django's strict host validation.
        server awxweb:80;
        keepalive 16;
    }

    upstream autoflow_api {
        server api:8000;
        keepalive 8;
    }

    # ── Server ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Nginx health endpoint (used by Docker healthcheck)
        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Autoflow API ─────────────────────────────────────
        location /api/autoflow/ {
            proxy_pass         http://autoflow_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # ── AWX Web UI & API ─────────────────────────────────
        location / {
            proxy_pass         http://awx_web;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # WebSocket support (AWX uses WebSockets for live output)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_buffering     off;
        }
    }
}
