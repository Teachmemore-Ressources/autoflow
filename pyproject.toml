# Autoflow — pyproject.toml — Apache 2.0

# ── Ruff — linter & formatter ─────────────────────────────────────────────────
[tool.ruff]
line-length    = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "S"]
ignore = [
    "S101",   # allow `assert` in tests
    "S603",   # allow subprocess calls (needed for Docker/Trivy in scanner)
    "S607",   # allow partial executable paths
    "N806",   # allow uppercase variable names (e.g. DOMAIN, CA_DIR in PKI)
    "N802",   # allow uppercase function names (legacy)
    "S108",   # /tmp paths in EE builder / cleanup are intentional
    "S110",   # try-except-pass in probe/detection loops is intentional
    "S112",   # try-except-continue in probe loops is intentional
    "S310",   # urllib.request.urlopen for local file:// CA reading is intentional
    "S501",   # httpx verify=False used only against internal self-signed PKI
]

[tool.ruff.lint.per-file-ignores]
"tests/**"        = ["S", "N"]  # disable security and naming checks in tests
"services/pki/**" = ["N"]       # PKI uses C-style uppercase constants

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
timeout      = 30
log_cli      = false
log_level    = "WARNING"

markers = [
    "unit: fast isolated tests — no external services",
    "integration: in-process tests with mocked/stubbed dependencies",
    "e2e: end-to-end tests requiring a running docker compose stack",
]

# E2E tests are opt-in: pytest -m e2e
addopts = "-m 'not e2e'"

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ── Coverage ───────────────────────────────────────────────────���──────────────
[tool.coverage.run]
source = ["services"]
omit   = [
    "*/tests/*",
    "*/tracing.py",
    "*/__pycache__/*",
    "services/pki/*",           # PKI uses os.getenv, not pydantic-settings
    "services/deploy-wizard/*", # wizard tested separately
    "services/ee-builder/*",    # builder tested separately
]

[tool.coverage.report]
fail_under   = 70
show_missing = true
skip_covered = false
