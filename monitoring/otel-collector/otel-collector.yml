# ─────────────────────────────────────────────────────────────
# OpenTelemetry Collector
# ─────────────────────────────────────────────────────────────
# Central collection point for all telemetry signals:
#   • Receives traces via OTLP from FastAPI services
#   • Forwards traces to Tempo
#   • Exposes span-derived metrics for Prometheus scraping
#
# Service endpoints:
#   gRPC OTLP : otel-collector:4317
#   HTTP OTLP : otel-collector:4318
#   Prometheus : otel-collector:8889   ← scraped by Prometheus
#   Health     : otel-collector:13133
# ─────────────────────────────────────────────────────────────

# ── Receivers ─────────────────────────────────────────────────
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["*"]

# ── Processors ────────────────────────────────────────────────
processors:
  # Batch spans before exporting to reduce network overhead
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Add a common deployment.environment attribute to every span
  resource:
    attributes:
      - key: deployment.environment
        value: "autoflow"
        action: upsert

  # Drop health-check and metrics scrape spans (noise reduction)
  filter/drop_health:
    traces:
      span:
        - 'attributes["http.route"] == "/health"'
        - 'attributes["http.route"] == "/healthz"'
        - 'attributes["http.route"] == "/metrics"'

  # Memory limiter — prevents OOM under burst load
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

# ── Exporters ─────────────────────────────────────────────────
exporters:
  # Forward traces to Tempo via OTLP gRPC
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Expose span-derived metrics for Prometheus scraping
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: otel
    const_labels:
      environment: autoflow

  # Debug exporter — disabled in production, enable for troubleshooting:
  # debug:
  #   verbosity: detailed

# ── Extensions ────────────────────────────────────────────────
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

# ── Pipelines ─────────────────────────────────────────────────
service:
  extensions: [health_check, pprof]

  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, filter/drop_health, resource, batch]
      exporters:  [otlp/tempo]

    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [prometheus]

  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888   # collector self-metrics
