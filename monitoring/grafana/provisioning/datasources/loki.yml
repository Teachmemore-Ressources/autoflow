apiVersion: 1

datasources:
  - name:   Loki
    type:   loki
    uid:    loki
    url:    http://loki:3100
    access: proxy
    isDefault: false
    editable:  false
    jsonData:
      # Durée maximale des requêtes de logs dans Grafana
      maxLines: 5000
      # Lier Loki à Prometheus pour la corrélation logs ↔ métriques
      # Un clic sur un log ouvre la vue Prometheus au même instant
      derivedFields:
        - name:          TraceID
          matcherRegex:  "trace_id=(\\w+)"
          url:           "$${__value.raw}"
          datasourceUid: prometheus
