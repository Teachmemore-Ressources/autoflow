# ─────────────────────────────────────────────────────────────
# Loki – Configuration Autoflow
# Mode : single binary (monolithic) — adapté pour un déploiement
#         single-node. Passer en mode "distributed" pour du HA.
# Backend : MinIO (S3-compatible) — production-ready, résilient.
# ─────────────────────────────────────────────────────────────

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# ── Common (paths, storage, ring) ────────────────────────────
# Le bloc common propage la config S3 à tous les composants
# (ingester, querier, compactor, ruler).
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    s3:
      endpoint:          minio:9000
      insecure:          true          # réseau interne — pas de TLS requis
      bucketnames:       loki-chunks
      access_key_id:     ${LOKI_S3_ACCESS_KEY}
      secret_access_key: ${LOKI_S3_SECRET_KEY}
      s3forcepathstyle:  true          # obligatoire pour MinIO (pas de virtual-hosted style)
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ── Schema de stockage ────────────────────────────────────────
# v13 + tsdb — format recommandé depuis Loki 2.8
# object_store: s3 → chunks + index TSDB stockés dans MinIO
schema_config:
  configs:
    - from: 2024-01-01
      store:        tsdb
      object_store: s3
      schema:       v13
      index:
        prefix: index_
        period: 24h

# ── Storage config — cache local TSDB ────────────────────────
# Les shards TSDB vont dans MinIO via common.storage.s3.
# Le cache local accélère les requêtes répétitives.
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location:         /loki/tsdb-cache
    cache_ttl:              24h

# ── Rétention des logs ────────────────────────────────────────
# LOKI_RETENTION est injecté depuis l'environnement Docker.
# Valeur par défaut : 720h (30 jours).
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled:   true
  retention_delete_delay: 2h
  delete_request_store: s3     # stocke les requêtes de suppression dans MinIO

limits_config:
  retention_period: ${LOKI_RETENTION:-720h}

  # Ingestion rate limits (par tenant, auth_enabled=false → tenant unique)
  ingestion_rate_mb:      16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit:   5MB
  per_stream_rate_limit_burst: 15MB

  # Taille maximale d'une requête de logs retournée
  max_entries_limit_per_query: 10000

# ── Cache de requêtes ─────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled:     true
        max_size_mb: 150

# ── Ruler (alertes sur logs) ──────────────────────────────────
# Les règles LogQL sont stockées localement (montage :ro depuis l'hôte).
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_api:       true
  ring:
    kvstore:
      store: inmemory
  rule_path: /loki/rules-temp
  storage:
    type: local
    local:
      directory: /loki/rules

# ── Tableau de bord analytique ────────────────────────────────
analytics:
  reporting_enabled: false
