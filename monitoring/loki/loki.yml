# ─────────────────────────────────────────────────────────────
# Loki – Configuration Autoflow
# Mode : single binary (monolithic) — adapté pour un déploiement
#         single-node. Passer en mode "distributed" pour du HA.
# ─────────────────────────────────────────────────────────────

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# ── Common (paths, storage, ring) ────────────────────────────
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ── Schema de stockage ────────────────────────────────────────
# v13 + tsdb — format recommandé depuis Loki 2.8
schema_config:
  configs:
    - from: 2024-01-01
      store:        tsdb
      object_store: filesystem
      schema:       v13
      index:
        prefix: index_
        period: 24h

# ── Rétention des logs ────────────────────────────────────────
# Durée de rétention globale. Peut être surchargée par stream selector
# via les overrides par tenant (limits_config).
# Valeur par défaut : 30 jours.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled:   true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  # Rétention globale des logs (modifiable sans redémarrage via API)
  retention_period: 720h   # 30 jours — ajuster selon les besoins

  # Ingestion rate limits (par tenant, auth_enabled=false → tenant unique)
  ingestion_rate_mb:      16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit:   5MB
  per_stream_rate_limit_burst: 15MB

  # Taille maximale d'une requête de logs retournée
  max_entries_limit_per_query: 10000

# ── Cache de requêtes ─────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled:     true
        max_size_mb: 150

# ── Ruler (alertes sur logs) ──────────────────────────────────
# Permet de définir des alertes LogQL dans monitoring/loki/rules/
# et de les envoyer à Alertmanager.
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_api:       true
  ring:
    kvstore:
      store: inmemory
  rule_path: /loki/rules-temp
  storage:
    type: local
    local:
      directory: /loki/rules

# ── Tableau de bord analytique ────────────────────────────────
analytics:
  reporting_enabled: false
