# ─────────────────────────────────────────────────────────────
# Prometheus – Scrape Configuration for Autoflow
# ─────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    environment: autoflow

# ── Alerting ──────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ── Rule files ────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ── Scrape jobs ───────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Autoflow FastAPI – exposes /metrics via prometheus-fastapi-instrumentator
  - job_name: autoflow_api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  # Autoflow Event Engine
  - job_name: event_engine
    static_configs:
      - targets: ['event_engine:8001']
    metrics_path: /metrics

  # PostgreSQL exporter
  # (awx_web intentionally omitted — AWX does not expose a /metrics endpoint)
  - job_name: postgres
    static_configs:
      - targets: ['postgres_exporter:9187']

  # Redis exporter
  - job_name: redis
    static_configs:
      - targets: ['redis_exporter:9121']

  # Grafana self-monitoring
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # Alertmanager self-monitoring
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: /metrics

  # Security Scanner — Trivy CVE results + image version metrics
  - job_name: security_scanner
    static_configs:
      - targets: ['security_scanner:8002']
    metrics_path: /metrics

  # Gitea — repository, user, and CI metrics
  - job_name: gitea
    static_configs:
      - targets: ['gitea:3001']
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/secrets/gitea_bearer_token

  # EE Builder — ansible-builder pipeline metrics (builds_total, builds_running)
  - job_name: ee_builder
    static_configs:
      - targets: ['ee_builder:8003']
    metrics_path: /metrics

# metric for pki
  - job_name: 'autoflow-pki'
    static_configs:
      - targets: ['pki:8004']
    metrics_path: /metrics
