groups:
  - name: security_scanner
    interval: 60s
    rules:

      # ── Scanner availability ──────────────────────────────────────────────

      - alert: SecurityScannerDown
        expr: up{job="security_scanner"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Security scanner is down"
          description: >-
            The security_scanner service has been unreachable for 5 minutes.
            CVE and version data are stale.

      # ── CVE severity alerts ───────────────────────────────────────────────

      # Fires immediately — no grace period is acceptable for critical CVEs.
      - alert: CriticalCVEDetected
        expr: trivy_vulnerabilities_total{severity="CRITICAL"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Critical CVE found in {{ $labels.image }}:{{ $labels.tag }}"
          description: >-
            {{ $value | printf "%.0f" }} CRITICAL vulnerabilities detected in
            {{ $labels.image }}:{{ $labels.tag }}.
            Immediate image update or mitigation required.

      - alert: HighCVECountElevated
        expr: trivy_vulnerabilities_total{severity="HIGH"} >= 5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "High CVE count in {{ $labels.image }}:{{ $labels.tag }}"
          description: >-
            {{ $value | printf "%.0f" }} HIGH severity vulnerabilities detected in
            {{ $labels.image }}:{{ $labels.tag }}.
            Consider updating the image.

      # ── Stale scan data ───────────────────────────────────────────────────

      # Fires when the last scan for an image is older than 12h (2× default 6h interval).
      # Indicates the scanner may be broken or Trivy DB download failed.
      - alert: SecurityScanStale
        expr: (time() - trivy_last_scan_timestamp_seconds) > 43200
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Security scan data is stale for {{ $labels.image }}"
          description: >-
            Last successful Trivy scan for {{ $labels.image }} was
            {{ $value | humanizeDuration }} ago (threshold: 12h).
            The scanner may be unable to reach the Docker socket or the Trivy DB.

      # ── Outdated image versions ───────────────────────────────────────────

      # 24h grace period to suppress noise from minor/patch releases published
      # overnight. Only fires when an image has been demonstrably behind for a full day.
      - alert: ImageVersionOutdated
        expr: image_version_outdated == 1
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "Image {{ $labels.image }} is outdated"
          description: >-
            Running {{ $labels.current_version }}, latest available is
            {{ $labels.latest_version }}.
            Update the image tag in docker-compose.yml and redeploy.
