# Autoflow — .gitea/workflows/ci.yml — Apache 2.0
# Continuous Integration pipeline for Gitea Actions.
# Syntax is identical to GitHub Actions — keep in sync with .github/workflows/ci.yml
#
# Triggered on push and pull_request on main and devel branches.

name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

env:
  PYTHON_VERSION: "3.10"

jobs:

  # ── Lint ────────────────���────────────────────────────���────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check services/ tests/

      - name: ruff format --check
        run: ruff format --check services/ tests/

  # ── Unit tests ────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install service dependencies
        run: |
          pip install -r services/api/requirements.txt
          pip install -r services/event-engine/requirements.txt

      - name: Install test tools
        run: |
          pip install -r tests/requirements.txt
          pip install coverage[toml] pytest-cov pytest-mock

      - name: Set test environment variables
        run: |
          echo "AWX_URL=http://awx-stub:8052"            >> $GITHUB_ENV
          echo "AWX_TOKEN=test-awx-token"                >> $GITHUB_ENV
          echo "AWX_JOB_TEMPLATE_ID=1"                   >> $GITHUB_ENV
          echo "API_SECRET_KEY=test-api-secret-32chars-long-xxxxxxxx" >> $GITHUB_ENV
          echo "AWX_ADMIN_USER=admin"                    >> $GITHUB_ENV
          echo "AWX_ADMIN_PASSWORD=test-awx-password"   >> $GITHUB_ENV
          echo "CORS_ORIGINS=http://testserver"          >> $GITHUB_ENV
          echo "ENV=development"                         >> $GITHUB_ENV
          echo "SECURITY_HEADERS_ENABLED=true"           >> $GITHUB_ENV
          echo "LOG_LEVEL=WARNING"                       >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_ENDPOINT="            >> $GITHUB_ENV
          echo "WIZARD_TOKEN=test-wizard-token"          >> $GITHUB_ENV
          echo "RULES_FILE="                             >> $GITHUB_ENV
          echo "SCHEDULES_FILE="                         >> $GITHUB_ENV
          echo "ADMIN_TOKEN=test-admin-token"            >> $GITHUB_ENV

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=services/shared \
            --cov=services/event-engine \
            --cov=services/api \
            --cov-report=term-missing \
            --cov-fail-under=70

  # ── Integration tests ────────────────────────────────────────────���────────────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install service dependencies
        run: |
          pip install -r services/api/requirements.txt
          pip install -r services/event-engine/requirements.txt

      - name: Install test tools
        run: |
          pip install -r tests/requirements.txt
          pip install pytest-mock

      - name: Set test environment variables
        run: |
          echo "AWX_URL=http://awx-stub:8052"            >> $GITHUB_ENV
          echo "AWX_TOKEN=test-awx-token"                >> $GITHUB_ENV
          echo "AWX_JOB_TEMPLATE_ID=1"                   >> $GITHUB_ENV
          echo "API_SECRET_KEY=test-api-secret-32chars-long-xxxxxxxx" >> $GITHUB_ENV
          echo "AWX_ADMIN_USER=admin"                    >> $GITHUB_ENV
          echo "AWX_ADMIN_PASSWORD=test-awx-password"   >> $GITHUB_ENV
          echo "CORS_ORIGINS=http://testserver"          >> $GITHUB_ENV
          echo "ENV=development"                         >> $GITHUB_ENV
          echo "SECURITY_HEADERS_ENABLED=true"           >> $GITHUB_ENV
          echo "LOG_LEVEL=WARNING"                       >> $GITHUB_ENV
          echo "OTEL_EXPORTER_OTLP_ENDPOINT="            >> $GITHUB_ENV
          echo "WIZARD_TOKEN=test-wizard-token"          >> $GITHUB_ENV
          echo "RULES_FILE="                             >> $GITHUB_ENV
          echo "SCHEDULES_FILE="                         >> $GITHUB_ENV
          echo "ADMIN_TOKEN=test-admin-token"            >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379"        >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short -m "not e2e"

  # ── Security scan ────────────────���──────────────────────────────���─────────────
  security-scan:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: |
          bandit -r services/ -ll \
            -x services/pki,services/deploy-wizard \
            --format txt || true
